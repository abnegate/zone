<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Zone - Self-hosted AI Stack Configuration" />

    <!-- Preconnect to external domains for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts with optimal loading strategy -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Zone Configuration</title>

    <script>
      (() => {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');

        try {
          const accent = window.localStorage.getItem('zone-accent') || 'blue';
          document.documentElement.setAttribute('data-accent', accent);
        } catch {
          document.documentElement.setAttribute('data-accent', 'blue');
        }
      })();
    </script>

    <!-- Critical inline styles for immediate render -->
    <style>
      /* Prevent FOUT with fallback fonts */
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: hsl(222.2 84% 4.9%);
        margin: 0;
      }
      /* Initial loading state */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid hsl(214.3 31.8% 91.4%);
        border-top-color: hsl(222.2 47.4% 11.2%);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 56px;
        gap: 12px;
        background: transparent;
      }
      .boot-eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 12px;
        color: hsl(215.4 16.3% 46.9%);
      }
      .boot-title {
        font-size: 36px;
        font-weight: 600;
        margin: 0;
      }
      .boot-subtitle {
        margin: 0;
        color: hsl(215.4 16.3% 46.9%);
        font-size: 16px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: hsl(222.2 84% 4.9%);
          color: hsl(210 40% 98%);
        }
        #root:empty::after {
          border-color: hsl(217.2 32.6% 17.5%);
          border-top-color: hsl(210 40% 98%);
        }
        .boot-shell {
          background: transparent;
        }
        .boot-eyebrow,
        .boot-subtitle {
          color: hsl(215 20.2% 65.1%);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-eyebrow">Zone Installer</div>
        <h1 class="boot-title">Preparing configuration wizard…</h1>
        <p class="boot-subtitle">Loading the setup experience.</p>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
