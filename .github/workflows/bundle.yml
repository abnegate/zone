name: Bundle

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the LTS tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      line: ${{ steps.version.outputs.line }}
      branch: ${{ steps.version.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the LTS release branches
        run: git fetch --no-tags origin '+refs/heads/release/*-lts:refs/remotes/origin/release/*-lts'

      - name: Resolve the LTS version
        id: version
        run: |
          set -eu
          result=$(sh scripts/lts-version.sh "$GITHUB_REF_NAME")
          printf '%s\n' "$result"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle (${{ matrix.architecture }})
    needs: check
    runs-on: ${{ matrix.runner }}
    environment: distribution
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ${{ vars.ZONE_LTS_RUNNER_AMD64 || 'ubuntu-24.04' }}
            machine: x86_64
            crane: go-containerregistry_Linux_x86_64.tar.gz
            crane-sha256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
            helm-sha256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
          - architecture: arm64
            runner: ${{ vars.ZONE_LTS_RUNNER_ARM64 || 'ubuntu-24.04-arm' }}
            machine: aarch64
            crane: go-containerregistry_Linux_arm64.tar.gz
            crane-sha256: 898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110
            helm-sha256: 8cf8f66ecbc252ac8f7f06cca68aba88508ddfde3a6a34feb1678ad1694b4f88
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ARCHITECTURE: ${{ matrix.architecture }}
      BUCKET: ${{ vars.ZONE_DISTRIBUTION_BUCKET }}
      REGION: ${{ vars.ZONE_DISTRIBUTION_REGION }}
      CRANE_VERSION: v0.22.1
      HELM_VERSION: v4.3.1
      MINIMUM_AWS_CLI: 2.33.0
      REGISTRY_IMAGE: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
      REGISTRY_CONTAINER: zone-publish-registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the runner
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          set -eu
          if [ -z "$BUCKET" ] || [ -z "$REGION" ]; then
            echo '::error::Set the ZONE_DISTRIBUTION_BUCKET and ZONE_DISTRIBUTION_REGION variables on the distribution environment'
            exit 1
          fi
          actual=$(uname -m)
          if [ "$actual" != "$MACHINE" ]; then
            echo "::error::The $ARCHITECTURE bundle ships the runner's crane, so it must build on $MACHINE, not $actual"
            exit 1
          fi
          cli=$(aws --version 2>&1 | sed -n 's|^aws-cli/\([0-9][0-9.]*\).*|\1|p')
          lowest=$(printf '%s\n%s\n' "$MINIMUM_AWS_CLI" "$cli" | sort -V | head -n 1)
          if [ -z "$cli" ] || [ "$lowest" != "$MINIMUM_AWS_CLI" ]; then
            echo "::error::AWS CLI $MINIMUM_AWS_CLI or later is needed for s3 cp --no-overwrite; found '${cli:-none}'"
            exit 1
          fi
          echo "AWS CLI $cli on $actual"

      - name: Free disk space
        run: |
          set -eu
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          best=''
          available=0
          for candidate in "$RUNNER_TEMP" /mnt; do
            [ -d "$candidate" ] || continue
            space=$(df -P -k "$candidate" | awk 'NR == 2 { print $4 }')
            if [ "$space" -gt "$available" ]; then
              best=$candidate
              available=$space
            fi
          done
          required=$((25 * 1024 * 1024))
          if [ "$available" -lt "$required" ]; then
            echo "::error::Only $((available / 1024 / 1024)) GiB free on the roomiest filesystem; the bundle needs 25 GiB"
            exit 1
          fi
          work=$best/zone-bundle
          sudo mkdir -p "$work"
          sudo chown "$(id -u):$(id -g)" "$work"
          echo "Bundling in $work with $((available / 1024 / 1024)) GiB free"
          printf 'WORK=%s\n' "$work" >> "$GITHUB_ENV"
          printf 'ARCHIVE=%s\n' "$work/zone-bundle-$VERSION-$ARCHITECTURE.tar" >> "$GITHUB_ENV"
          df -h

      - name: Install crane
        env:
          CRANE: ${{ matrix.crane }}
          CRANE_SHA256: ${{ matrix.crane-sha256 }}
        run: |
          set -eu
          directory=$RUNNER_TEMP/crane
          mkdir -p "$directory/bin"
          curl -fsSL --retry 3 -o "$directory/$CRANE" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/$CRANE"
          (cd "$directory" && printf '%s  %s\n' "$CRANE_SHA256" "$CRANE" | sha256sum -c -)
          tar -xzf "$directory/$CRANE" -C "$directory/bin" crane LICENSE
          "$directory/bin/crane" version
          printf 'CRANE_PATH=%s\n' "$directory/bin/crane" >> "$GITHUB_ENV"

      - name: Install helm
        env:
          HELM_SHA256: ${{ matrix.helm-sha256 }}
        run: |
          set -eu
          directory=$RUNNER_TEMP/helm
          archive=helm-$HELM_VERSION-linux-$ARCHITECTURE.tar.gz
          mkdir -p "$directory/bin"
          curl -fsSL --retry 3 -o "$directory/$archive" "https://get.helm.sh/$archive"
          (cd "$directory" && printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum -c -)
          tar -xzf "$directory/$archive" -C "$directory/bin" --strip-components 1 "linux-$ARCHITECTURE/helm"
          printf '%s\n' "$directory/bin" >> "$GITHUB_PATH"
          "$directory/bin/helm" version --short

      - name: Build chart dependencies
        run: |
          set -eu
          for chart in helm/*/Chart.yaml; do
            if grep -q '^dependencies:' "$chart"; then
              helm dependency build "$(dirname -- "$chart")"
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ZONE_DISTRIBUTION_ROLE }}
          aws-region: ${{ vars.ZONE_DISTRIBUTION_REGION }}
          role-session-name: zone-bundle-${{ matrix.architecture }}
          role-duration-seconds: 7200

      - name: Start the publish registry
        env:
          REGISTRY_STORAGE_S3_BUCKET: ${{ vars.ZONE_DISTRIBUTION_BUCKET }}
          REGISTRY_STORAGE_S3_REGION: ${{ vars.ZONE_DISTRIBUTION_REGION }}
        run: |
          set -eu
          config=$GITHUB_WORKSPACE/runner/zone_license/deploy/registry/publish.yml
          if [ ! -f "$config" ]; then
            echo '::error::runner/zone_license/deploy/registry/publish.yml is missing'
            exit 1
          fi
          docker run --detach --name "$REGISTRY_CONTAINER" --network host \
            --volume "$config:/etc/distribution/config.yml:ro" \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env AWS_SESSION_TOKEN \
            --env AWS_REGION \
            --env REGISTRY_STORAGE_S3_BUCKET \
            --env REGISTRY_STORAGE_S3_REGION \
            "$REGISTRY_IMAGE" > /dev/null
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/v2/; then
              echo 'The publish registry is listening on 127.0.0.1:5000'
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 50 "$REGISTRY_CONTAINER" >&2
          echo '::error::The publish registry did not answer on 127.0.0.1:5000'
          exit 1

      - name: Assemble the bundle
        run: |
          set -eu
          df -h
          sh scripts/bundle.sh \
            --version "$VERSION" \
            --architecture "$ARCHITECTURE" \
            --registry 127.0.0.1:5000 \
            --crane "$CRANE_PATH" \
            --output "$WORK"
          cat "$ARCHIVE.sha256"
          df -h

      - name: Stop the publish registry
        if: always()
        run: docker rm --force "$REGISTRY_CONTAINER" > /dev/null 2>&1 || true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the checksum
        run: cosign sign-blob --yes --bundle "$ARCHIVE.sha256.sigstore.json" "$ARCHIVE.sha256"

      - name: Verify the signature
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bundle.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle "$ARCHIVE.sha256.sigstore.json" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$ARCHIVE.sha256"

      - name: Verify the signature and checksum offline, as docs/AIRGAP.md does
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bundle.yml@${{ github.ref }}
        run: |
          set -eu
          name=$(basename -- "$ARCHIVE")
          offline=$WORK/offline
          rm -rf -- "$offline"
          mkdir -- "$offline"
          ln -- "$ARCHIVE" "$offline/$name"
          cp -- "$ARCHIVE.sha256" "$ARCHIVE.sha256.sigstore.json" "$offline/"
          cd "$offline"
          cosign initialize
          cp ~/.sigstore/root/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json .
          isolated() {
            sudo unshare --net -- "$@"
          }
          if isolated curl --silent --max-time 10 --output /dev/null https://tuf-repo-cdn.sigstore.dev; then
            echo '::error::The isolated network namespace still reaches the internet, so it proves nothing'
            exit 1
          fi
          isolated "$(command -v cosign)" verify-blob \
            --bundle "$name.sha256.sigstore.json" \
            --trusted-root trusted_root.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$name.sha256"
          isolated sha256sum -c "$name.sha256"
          cd "$WORK"
          rm -rf -- "$offline"

      - name: Refresh AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ZONE_DISTRIBUTION_ROLE }}
          aws-region: ${{ vars.ZONE_DISTRIBUTION_REGION }}
          role-session-name: zone-bundle-${{ matrix.architecture }}

      - name: Upload the bundle
        run: |
          set -eu
          df -h
          sh scripts/bundle-upload.sh "$BUCKET" "$VERSION" "$ARCHIVE"
          df -h
