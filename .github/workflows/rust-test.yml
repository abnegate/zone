name: Rust Tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/rust-test.yml'
  pull_request:
    paths:
      - 'runner/**'
      - '.github/workflows/rust-test.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, beta]

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zone_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-test-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-test-
            ${{ runner.os }}-${{ matrix.rust }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Run database migrations
        if: runner.os == 'Linux'
        run: |
          cd zone_server
          psql -h localhost -U postgres -d zone_test -f migrations/001_initial_schema.sql
        env:
          PGPASSWORD: postgres

      - name: Build
        run: cargo build --all-targets

      - name: Run unit tests
        run: cargo test --lib --all-features
        env:
          DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}

      - name: Run integration tests
        run: cargo test --test '*' --all-features
        env:
          DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --doc
        env:
          DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}

  # Service containers are Linux-only, so macOS must be a separate job.
  test-macos:
    name: Test Suite (macos-latest, stable)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-stable-cargo-test-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-stable-cargo-test-
            ${{ runner.os }}-stable-cargo-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      - name: Run unit tests
        run: cargo test --lib --all-features

      - name: Run integration tests
        run: cargo test --test '*' --all-features
        env:
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --doc

  # Ensure minimum supported Rust version compiles
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
            ${{ runner.os }}-cargo-

      - name: Check MSRV
        run: cargo check --all-targets
