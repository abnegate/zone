name: Rust Tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - 'scripts/patch-tauri-android.sh'
      - '.github/workflows/rust-test.yml'
  pull_request:
    paths:
      - 'runner/**'
      - 'scripts/patch-tauri-android.sh'
      - '.github/workflows/rust-test.yml'

env:
  CARGO_TERM_COLOR: always
  # Default local-embeddings links ONNX into every test binary; debug symbols
  # then exhaust the hosted runner disk during `cargo build --all-targets`.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, beta]

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zone_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner
          shared-key: test-${{ matrix.rust }}
          cache-on-failure: true

      # zone_comfy turns a submitted clip into training frames through ffmpeg.
      # Without it that path's end-to-end test skips itself.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install sqlx-cli and cargo-nextest
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: sqlx-cli@0.9.0,cargo-nextest@0.9.143

      - name: Run database migrations
        if: runner.os == 'Linux'
        working-directory: runner/zone_server
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test

      - name: Build
        run: cargo build --workspace --exclude zone_desktop --all-targets --no-default-features --features zone_context/test-utils

      - name: Run tests
        run: cargo nextest run --workspace --exclude zone_desktop --all-targets --no-fail-fast --no-default-features --features zone_context/test-utils
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --workspace --exclude zone_desktop --doc --no-default-features --features zone_context/test-utils
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          REDIS_URL: redis://localhost:6379

  # Service containers are Linux-only, so macOS must be a separate job.
  test-macos:
    name: Test Suite (macos-latest, stable)
    runs-on: macos-latest
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:55432/zone_test
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/zone_test
      REDIS_URL: redis://127.0.0.1:56379
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner
          shared-key: test-stable
          cache-on-failure: true

      - name: Install database services
        run: |
          brew install postgresql@18 pgvector redis
          echo "PGDATA=$RUNNER_TEMP/zone-postgres" >> "$GITHUB_ENV"
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"

      # zone_comfy turns a submitted clip into training frames through ffmpeg.
      # Without it the frames endpoint reports 503 and cannot reject bad input.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Start database services
        run: |
          initdb --username=postgres --auth=trust --encoding=UTF8
          pg_ctl start --wait --timeout=30 --log="$RUNNER_TEMP/postgres.log" --options="-h 127.0.0.1 -p 55432"
          createdb --host=127.0.0.1 --port=55432 --username=postgres zone_test
          redis-server --bind 127.0.0.1 --port 56379 --daemonize yes --pidfile "$RUNNER_TEMP/zone-redis.pid" --dir "$RUNNER_TEMP" --save '' --appendonly no
          for _ in {1..30}; do
            if [ "$(redis-cli -h 127.0.0.1 -p 56379 ping)" = PONG ]; then
              break
            fi
            sleep 1
          done
          test "$(redis-cli -h 127.0.0.1 -p 56379 ping)" = PONG

      - name: Install sqlx-cli and cargo-nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: sqlx-cli@0.9.0,cargo-nextest@0.9.143

      - name: Run database migrations
        working-directory: runner/zone_server
        run: sqlx migrate run

      - name: Build
        run: cargo build --workspace --exclude zone_desktop --all-targets --no-default-features --features zone_context/test-utils

      - name: Run tests
        run: cargo nextest run --workspace --exclude zone_desktop --all-targets --no-fail-fast --no-default-features --features zone_context/test-utils
        env:
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --workspace --exclude zone_desktop --doc --no-default-features --features zone_context/test-utils

      - name: Stop database services
        if: always()
        run: |
          if [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl stop --mode=fast --wait --timeout=30
          fi
          if [ -f "$RUNNER_TEMP/zone-redis.pid" ]; then
            redis-cli -h 127.0.0.1 -p 56379 shutdown nosave
          fi

  # Ensure minimum supported Rust version compiles
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner
          shared-key: msrv
          cache-on-failure: true

      - name: Check MSRV
        run: cargo check --workspace --exclude zone_desktop --all-targets --no-default-features --features zone_context/test-utils
