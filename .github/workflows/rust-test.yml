name: Rust Tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/rust-test.yml'
  pull_request:
    paths:
      - 'runner/**'
      - '.github/workflows/rust-test.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          # Only test beta on Linux to save CI time
          - os: macos-latest
            rust: beta

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zone_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-test-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-test-
            ${{ runner.os }}-${{ matrix.rust }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Run database migrations
        if: runner.os == 'Linux'
        run: |
          cd zone_server
          psql -h localhost -U postgres -d zone_test -f migrations/001_initial_schema.sql
        env:
          PGPASSWORD: postgres

      - name: Build
        run: cargo build --workspace --exclude zone_desktop --all-targets

      - name: Run unit tests
        run: cargo test --workspace --exclude zone_desktop --lib --all-features
        env:
          DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}

      - name: Run integration tests
        run: cargo test --workspace --exclude zone_desktop --test '*' --all-features
        env:
          DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --workspace --exclude zone_desktop --doc
        env:
          DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:postgres@localhost:5432/zone_test' || '' }}

  # Ensure minimum supported Rust version compiles
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
            ${{ runner.os }}-cargo-

      - name: Check MSRV
        run: cargo check --workspace --exclude zone_desktop --all-targets
