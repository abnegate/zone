name: Rust Tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/rust-test.yml'
  pull_request:
    paths:
      - 'runner/**'
      - '.github/workflows/rust-test.yml'

env:
  CARGO_TERM_COLOR: always
  # Default local-embeddings links ONNX into every test binary; debug symbols
  # then exhaust the hosted runner disk during `cargo build --all-targets`.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, beta]

    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zone_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-test-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-test-
            ${{ runner.os }}-${{ matrix.rust }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Run database migrations
        if: runner.os == 'Linux'
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U postgres -d zone_test -v ON_ERROR_STOP=1 -f "$f"
          done
        working-directory: runner/zone_server
        env:
          PGPASSWORD: postgres

      - name: Build
        run: cargo build --all-targets --no-default-features --features zone_context/test-utils

      - name: Run unit tests
        run: cargo test --lib --no-default-features --features zone_context/test-utils
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: cargo test --test '*' --no-default-features --features zone_context/test-utils
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          REDIS_URL: redis://localhost:6379
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --doc --no-default-features --features zone_context/test-utils
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zone_test
          REDIS_URL: redis://localhost:6379

  # Service containers are Linux-only, so macOS must be a separate job.
  test-macos:
    name: Test Suite (macos-latest, stable)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-stable-cargo-test-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-stable-cargo-test-
            ${{ runner.os }}-stable-cargo-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets --no-default-features --features zone_context/test-utils

      - name: Run unit tests
        run: cargo test --lib --no-default-features --features zone_context/test-utils

      - name: Run integration tests
        # zone_server integration tests require Postgres/Valkey service containers.
        run: cargo test --test '*' --no-default-features --features zone_context/test-utils --workspace --exclude zone_server
        env:
          RUST_BACKTRACE: 1

      - name: Run doc tests
        run: cargo test --doc --no-default-features --features zone_context/test-utils

  # Ensure minimum supported Rust version compiles
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('runner/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-
            ${{ runner.os }}-cargo-

      - name: Check MSRV
        run: cargo check --all-targets
