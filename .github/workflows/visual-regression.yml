name: Visual Regression Testing

on:
  pull_request:
    paths:
      - 'manager/frontend/**'
      - 'packages/ui/**'
      - '.github/workflows/visual-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'manager/frontend/**'
      - 'packages/ui/**'
      - '.github/workflows/visual-regression.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: manager/frontend

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        working-directory: ${{ github.workspace }}

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Build frontend
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview &
          sleep 5
          curl -f http://localhost:4173 || exit 1

      - name: Take PR screenshots
        run: |
          # screenshots/ holds PNGs committed to the repository, most of them
          # written by suites this job does not run. Clearing it first leaves
          # the directory holding exactly what this run rendered, so the
          # comparison never treats a checked-in file as a fresh render.
          rm -rf screenshots screenshots-pr
          PLAYWRIGHT_REUSE_SERVER=true PLAYWRIGHT_PORT=4173 bunx playwright test e2e/screenshots.e2e.ts --project=chromium
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "::error::the screenshot suite rendered nothing"
            exit 1
          fi
          mkdir -p screenshots-pr
          cp screenshots/*.png screenshots-pr/
        env:
          RUN_SCREENSHOTS: 'true'

      # Installed only now, and never in the baseline job: it drags in font
      # packages, and a renderer with extra fonts available produces different
      # glyphs from one without them for anything that falls back.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      # The screenshots in this PR were rendered from the merge of the PR into
      # its base, so the only honest baseline is that same base commit. Falling
      # straight back to "newest artifact on main" reports everything that has
      # landed on main since as a change made by this PR.
      - name: Resolve baseline commit
        id: baseline
        run: |
          base_ref="origin/${BASE_REF}"
          if git rev-parse --verify --quiet "$base_ref" >/dev/null; then
            echo "sha=$(git merge-base "$base_ref" HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$base_ref is not available; falling back to the newest ${BASE_REF} baseline"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Download baseline screenshots (base commit)
        if: steps.baseline.outputs.sha != ''
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: visual-regression.yml
          commit: ${{ steps.baseline.outputs.sha }}
          name: baseline-screenshots
          path: manager/frontend/screenshots-baseline
          if_no_artifact_found: warn
        continue-on-error: true

      # The baseline job is path-filtered, so plenty of base commits never
      # produced one. Those fall back to the newest baseline on the base branch.
      - name: Check for a base-commit baseline
        id: pinned
        run: |
          if [ -n "$(ls -A screenshots-baseline 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download baseline screenshots (newest on base branch)
        if: steps.pinned.outputs.found != 'true'
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: visual-regression.yml
          branch: ${{ github.event.pull_request.base.ref }}
          name: baseline-screenshots
          path: manager/frontend/screenshots-baseline
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Describe the baseline
        id: baseline_source
        run: |
          if [ -z "$(ls -A screenshots-baseline 2>/dev/null)" ]; then
            echo "description=no baseline was available" >> "$GITHUB_OUTPUT"
          elif [ "$PINNED" = 'true' ]; then
            echo "description=base commit \`${SHA:0:7}\`" >> "$GITHUB_OUTPUT"
          else
            echo "description=the newest \`${BASE_REF}\` run rather than this PR's base commit, so drift from other merges is possible" >> "$GITHUB_OUTPUT"
          fi
        env:
          PINNED: ${{ steps.pinned.outputs.found }}
          SHA: ${{ steps.baseline.outputs.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Compare screenshots
        id: compare
        env:
          # Headless Chromium does not rasterise text and gradients identically
          # from one runner to the next, so an exact match is not achievable.
          # Ignore per-pixel colour differences below FUZZ_PERCENT, then ignore
          # the survivors until they cover enough of the image to be real. The
          # step logs the measured count for every screenshot it passes, so
          # these can be retuned against what CI actually reports.
          FUZZ_PERCENT: '4'
          MAX_DIFF_RATIO: '0.0002'
          MIN_DIFF_PIXELS: '150'
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          shopt -s nullglob
          mkdir -p screenshots-diff
          report=$(mktemp)
          changed_count=0

          # ImageMagick 7 drops the legacy binaries in favour of subcommands.
          if command -v compare >/dev/null 2>&1; then
            im_compare() { compare "$@"; }
            im_composite() { composite "$@"; }
            im_identify() { identify "$@"; }
          else
            im_compare() { magick compare "$@"; }
            im_composite() { magick composite "$@"; }
            im_identify() { magick identify "$@"; }
          fi

          if [ -z "$(ls -A screenshots-baseline 2>/dev/null)" ]; then
            echo "No baseline screenshots found. Nothing to compare against."
            {
              echo "changes=new"
              echo "changed_count=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for pr_file in screenshots-pr/*.png; do
            filename=$(basename "$pr_file")
            baseline_file="screenshots-baseline/$filename"
            diff_file="screenshots-diff/$filename"

            if [ ! -f "$baseline_file" ]; then
              echo "NEW: $filename"
              printf -- '- **NEW**: `%s`\n' "$filename" >> "$report"
              changed_count=$((changed_count + 1))
              cp "$pr_file" "$diff_file"
              continue
            fi

            # A size mismatch makes the pixel metric meaningless: compare exits
            # 2 and writes an error to stderr rather than a count, so catch it
            # here and report it as the layout change it is.
            baseline_size=$(im_identify -format '%wx%h' "${baseline_file}[0]" 2>/dev/null || true)
            pr_size=$(im_identify -format '%wx%h' "${pr_file}[0]" 2>/dev/null || true)
            if [ -z "$baseline_size" ] || [ -z "$pr_size" ]; then
              echo "::error::could not read the dimensions of $filename"
              exit 1
            fi
            if [ "$baseline_size" != "$pr_size" ]; then
              echo "RESIZED: $filename ($baseline_size -> $pr_size)"
              printf -- '- **RESIZED**: `%s` (%s to %s)\n' "$filename" "$baseline_size" "$pr_size" >> "$report"
              changed_count=$((changed_count + 1))
              cp "$pr_file" "$diff_file"
              continue
            fi

            # compare exits 0 when identical and 1 when the images differ;
            # anything higher is a tool failure, not a visual change.
            metric=$(mktemp)
            status=0
            im_compare -metric AE -fuzz "${FUZZ_PERCENT}%" \
              "$baseline_file" "$pr_file" "$diff_file" 2>"$metric" || status=$?
            if [ "$status" -gt 1 ]; then
              echo "::error::comparing $filename failed: $(cat "$metric")"
              rm -f "$metric"
              exit 1
            fi

            # AE is a pixel count, but the exact spelling varies by build, so
            # take the leading number and refuse to guess if there is not one.
            diff_pixels=$(tr -d ',' <"$metric" | grep -oE '[0-9]+(\.[0-9]+)?' | head -n 1 || true)
            rm -f "$metric"
            if [ -z "$diff_pixels" ]; then
              echo "::error::no pixel count in the compare output for $filename"
              exit 1
            fi

            total=$(( ${baseline_size%x*} * ${baseline_size#*x} ))
            read -r verdict percent <<<"$(awk \
              -v diff="$diff_pixels" -v total="$total" \
              -v ratio="$MAX_DIFF_RATIO" -v floor="$MIN_DIFF_PIXELS" \
              'BEGIN {
                 limit = total * ratio
                 if (limit < floor) limit = floor
                 printf "%s %.4f", (diff > limit ? "changed" : "same"), (total ? 100 * diff / total : 0)
               }')"

            if [ "$verdict" = 'changed' ]; then
              echo "CHANGED: $filename ($diff_pixels of $total px, ${percent}%)"
              printf -- '- **CHANGED**: `%s` (%s pixels, %s%% of the image)\n' \
                "$filename" "$diff_pixels" "$percent" >> "$report"
              changed_count=$((changed_count + 1))
              im_composite -blend 50% "$baseline_file" "$pr_file" \
                "screenshots-diff/blend-$filename" 2>/dev/null || true
            else
              # Within tolerance, so keep it out of the diff artifact entirely.
              echo "unchanged: $filename ($diff_pixels px, ${percent}%)"
              rm -f "$diff_file"
            fi
          done

          # Baselines uploaded before the rendered-only convention also carried
          # every committed PNG, so a screenshot this run did not render is not
          # evidence that anything was deleted. Only a manifested baseline can
          # support that claim; against an older one, say the check was skipped
          # rather than reporting dozens of screens as removed.
          if [ -f screenshots-baseline/rendered-screenshots.txt ]; then
            echo "removed_check=ran" >> "$GITHUB_OUTPUT"
            for baseline_file in screenshots-baseline/*.png; do
              filename=$(basename "$baseline_file")
              if [ ! -f "screenshots-pr/$filename" ]; then
                echo "REMOVED: $filename"
                printf -- '- **REMOVED**: `%s`\n' "$filename" >> "$report"
                changed_count=$((changed_count + 1))
              fi
            done
          else
            echo "removed_check=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning::the baseline predates the rendered-only convention, so deleted screenshots were not checked; it is replaced by the next ${BASE_REF} run"
          fi

          echo "Compared against the baseline: $changed_count change(s)."
          {
            echo "changed_count=$changed_count"
            echo 'changes<<VISUAL_REGRESSION_EOF'
            cat "$report"
            echo 'VISUAL_REGRESSION_EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f "$report"

      - name: Upload diff screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.compare.outputs.changed_count != '0'
        with:
          name: screenshot-diffs
          path: manager/frontend/screenshots-diff/
          retention-days: 14

      - name: Upload PR screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-screenshots
          path: manager/frontend/screenshots-pr/
          retention-days: 14

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always() && steps.compare.outcome == 'success'
        env:
          CHANGED_COUNT: ${{ steps.compare.outputs.changed_count }}
          CHANGES: ${{ steps.compare.outputs.changes }}
          BASELINE: ${{ steps.baseline_source.outputs.description }}
          REMOVED_CHECK: ${{ steps.compare.outputs.removed_check }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const changedCount = process.env.CHANGED_COUNT || '';
            const changes = (process.env.CHANGES || '').trim();
            const baseline = process.env.BASELINE || 'an unidentified baseline';
            const runUrl = process.env.RUN_URL;

            // A baseline predating the rendered-only convention cannot tell a
            // deleted screen from one this suite never renders, so that check
            // is skipped. Say so rather than leaving it out of the report.
            const caveat = process.env.REMOVED_CHECK === 'skipped'
              ? ['', '_Deleted screenshots were not checked: the baseline predates the rendered-only convention and is replaced by the next run on the base branch._']
              : [];

            // Built line by line: an indented template literal would give every
            // line four or more leading spaces, which GitHub renders as code.
            let lines;

            if (changes === 'new') {
              lines = [
                '## Visual Regression Report',
                '',
                '**First run - establishing baseline screenshots.**',
                '',
                'No baseline artifact was available to compare against. These screenshots become the baseline for future PRs.',
                '',
                `[Download screenshots](${runUrl})`,
              ];
            } else if (changedCount === '0' || changes === '') {
              lines = [
                '## Visual Regression Report',
                '',
                `No visual changes detected against ${baseline}.`,
                '',
                'Every screenshot matched within the comparison tolerance.',
                ...caveat,
              ];
            } else {
              lines = [
                '## Visual Regression Report',
                '',
                `**${changedCount} visual change(s) detected** against ${baseline}.`,
                '',
                '### Changed screenshots',
                '',
                changes,
                '',
                '### Review the changes',
                '',
                `1. [Download the diff images](${runUrl}) - red highlights show the changed pixels.`,
                '2. Check each one is intentional.',
                '',
                'If the changes are expected, merge the PR to update the baseline.',
                ...caveat,
              ];
            }

            const body = lines.join('\n');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Visual Regression Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  update-baseline:
    name: Update Baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: manager/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        working-directory: ${{ github.workspace }}

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Build frontend
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview &
          sleep 5
          curl -f http://localhost:4173 || exit 1

      - name: Take baseline screenshots
        run: |
          # Mirrors the PR job: only what this run renders may become baseline.
          rm -rf screenshots
          PLAYWRIGHT_REUSE_SERVER=true PLAYWRIGHT_PORT=4173 bunx playwright test e2e/screenshots.e2e.ts --project=chromium
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "::error::the screenshot suite rendered nothing"
            exit 1
          fi
          # The manifest marks this artifact as rendered-only. A PR that finds
          # it can trust that a missing screenshot really was deleted; one that
          # finds an older artifact cannot, because those carried every
          # committed PNG as well.
          (cd screenshots && ls -1 ./*.png | sed 's|^\./||') > screenshots/rendered-screenshots.txt
        env:
          RUN_SCREENSHOTS: 'true'

      - name: Upload baseline screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-screenshots
          path: manager/frontend/screenshots/
          retention-days: 90
