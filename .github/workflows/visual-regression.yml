name: Visual Regression Testing

on:
  pull_request:
    paths:
      - 'manager/frontend/**'
      - 'installer/frontend/**'
      - 'packages/ui/**'
  push:
    branches:
      - main
    paths:
      - 'manager/frontend/**'
      - 'installer/frontend/**'
      - 'packages/ui/**'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: manager/frontend

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: bun install
        working-directory: ${{ github.workspace }}

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Build UI package
        run: bun run build:css
        working-directory: ${{ github.workspace }}/packages/ui

      - name: Build frontend
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview &
          sleep 5
          curl -f http://localhost:4173 || exit 1

      - name: Take PR screenshots
        run: |
          mkdir -p screenshots-pr
          PLAYWRIGHT_REUSE_SERVER=true PLAYWRIGHT_PORT=4173 bunx playwright test e2e/screenshots.e2e.ts --project=chromium
          cp screenshots/*.png screenshots-pr/

      - name: Download baseline screenshots
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: visual-regression.yml
          branch: main
          name: baseline-screenshots
          path: manager/frontend/screenshots-baseline
        continue-on-error: true

      - name: Compare screenshots
        id: compare
        run: |
          mkdir -p screenshots-diff
          CHANGES=""
          CHANGED_COUNT=0

          # If no baseline exists, all screenshots are new
          if [ ! -d "screenshots-baseline" ] || [ -z "$(ls -A screenshots-baseline 2>/dev/null)" ]; then
            echo "No baseline screenshots found. All screenshots are new."
            echo "changes=new" >> $GITHUB_OUTPUT
            echo "changed_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare each screenshot
          for pr_file in screenshots-pr/*.png; do
            filename=$(basename "$pr_file")
            baseline_file="screenshots-baseline/$filename"
            diff_file="screenshots-diff/$filename"

            if [ ! -f "$baseline_file" ]; then
              echo "NEW: $filename"
              CHANGES="${CHANGES}- **NEW**: \`$filename\`\n"
              CHANGED_COUNT=$((CHANGED_COUNT + 1))
              cp "$pr_file" "$diff_file"
            else
              # Use ImageMagick to compare images and calculate difference
              DIFF=$(compare -metric AE "$baseline_file" "$pr_file" "$diff_file" 2>&1 || true)

              if [ "$DIFF" != "0" ] && [ -n "$DIFF" ]; then
                echo "CHANGED: $filename (diff: $DIFF pixels)"
                CHANGES="${CHANGES}- **CHANGED**: \`$filename\` ($DIFF pixels different)\n"
                CHANGED_COUNT=$((CHANGED_COUNT + 1))

                # Create a visual diff overlay
                composite -blend 50% "$baseline_file" "$pr_file" "screenshots-diff/blend-$filename" 2>/dev/null || true
              fi
            fi
          done

          # Check for removed screenshots
          if [ -d "screenshots-baseline" ]; then
            for baseline_file in screenshots-baseline/*.png; do
              if [ -f "$baseline_file" ]; then
                filename=$(basename "$baseline_file")
                pr_file="screenshots-pr/$filename"

                if [ ! -f "$pr_file" ]; then
                  echo "REMOVED: $filename"
                  CHANGES="${CHANGES}- **REMOVED**: \`$filename\`\n"
                  CHANGED_COUNT=$((CHANGED_COUNT + 1))
                fi
              fi
            done
          fi

          # Write to output (escape newlines for GitHub Actions)
          echo "changed_count=$CHANGED_COUNT" >> $GITHUB_OUTPUT
          {
            echo 'changes<<EOF'
            echo -e "$CHANGES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Upload diff screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.compare.outputs.changed_count != '0'
        with:
          name: screenshot-diffs
          path: manager/frontend/screenshots-diff/
          retention-days: 14

      - name: Upload PR screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-screenshots
          path: manager/frontend/screenshots-pr/
          retention-days: 14

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always()
        with:
          script: |
            const changedCount = '${{ steps.compare.outputs.changed_count }}';
            const changes = `${{ steps.compare.outputs.changes }}`;

            let body = '';

            if (changedCount === '0' && changes !== 'new') {
              body = `## Visual Regression Report

            No visual changes detected in this PR.

            All screenshots match the baseline.`;
            } else if (changes.trim() === '' || changedCount === '0') {
              body = `## Visual Regression Report

            **First run - establishing baseline screenshots.**

            All screenshots have been captured and will be used as the baseline for future PRs.

            [Download screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            } else {
              body = `## Visual Regression Report

            **${changedCount} visual change(s) detected!**

            ### Changed Screenshots:
            ${changes}

            ### Review the changes:
            1. [Download diff images](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) - Red highlights show changed pixels
            2. Review each changed screenshot to ensure the changes are intentional

            If these changes are expected, merge the PR to update the baseline.`;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Visual Regression Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  visual-regression-installer:
