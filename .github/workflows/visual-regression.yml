        with:
          name: installer-screenshot-diffs
          path: installer/frontend/screenshots-diff/
          retention-days: 14

      - name: Upload PR screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
