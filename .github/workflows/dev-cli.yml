name: Development CLI

on:
  push:
    branches: [main]
    paths:
      - 'tools/dev-cli/**'
      - 'Makefile'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'scripts/compose.sh'
      - 'scripts/configure-model-proxy.sh'
      - 'scripts/test-compose-profiles.sh'
      - 'scripts/test-migrations.py'
      - 'scripts/test-compose-up.py'
      - 'scripts/test-backup.py'
      - 'scripts/test-dockerfile-members.sh'
      - 'ollama/pull-models.sh'
      - 'scripts/test-pull-models.sh'
      - 'manager/Dockerfile'
      - 'runner/Cargo.toml'
      - '.dockerignore'
      - '.github/workflows/dev-cli.yml'
  pull_request:
    paths:
      - 'tools/dev-cli/**'
      - 'Makefile'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'scripts/compose.sh'
      - 'scripts/configure-model-proxy.sh'
      - 'scripts/test-compose-profiles.sh'
      - 'scripts/test-migrations.py'
      - 'scripts/test-compose-up.py'
      - 'scripts/test-backup.py'
      - 'scripts/test-dockerfile-members.sh'
      - 'ollama/pull-models.sh'
      - 'scripts/test-pull-models.sh'
      - 'manager/Dockerfile'
      - 'runner/Cargo.toml'
      - '.dockerignore'
      - '.github/workflows/dev-cli.yml'

permissions:
  contents: read

jobs:
  test:
    name: CLI and migration commands
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Check formatting
        run: cargo fmt --manifest-path tools/dev-cli/Cargo.toml --check

      - name: Lint all CLI targets
        run: cargo clippy --manifest-path tools/dev-cli/Cargo.toml --all-targets -- -D warnings

      - name: Run CLI unit and integration tests
        run: cargo test --manifest-path tools/dev-cli/Cargo.toml --all-targets

      - name: Verify migration Make commands without Docker
        run: python3 scripts/test-migrations.py

      - name: Verify make up and make dev retire left-out profiles without Docker
        run: python3 scripts/test-compose-up.py

      - name: Verify profile selection and retirement against real Compose
        run: |
          docker compose version
          sh scripts/test-compose-profiles.sh

      - name: Verify backup and restore Make commands, also against throwaway Docker volumes
        env:
          ZONE_TEST_DOCKER: '1'
        run: python3 scripts/test-backup.py

      - name: Verify backup and restore Make commands under busybox sh, as an Alpine host runs them
        run: >-
          docker run --rm -v "$PWD:/zone:ro" -w /zone
          alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          sh -c 'apk add --no-cache make python3 >/dev/null && python3 scripts/test-backup.py'

      - name: Verify the manager Dockerfile copies every workspace member
        run: sh scripts/test-dockerfile-members.sh

      - name: Verify the Ollama pull script prints plain text to logs
        run: sh scripts/test-pull-models.sh
