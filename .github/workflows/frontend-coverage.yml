name: Frontend Coverage

on:
  push:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - '.github/workflows/frontend-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - '.github/workflows/frontend-coverage.yml'

jobs:
  coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-coverage-report
          path: manager/frontend/coverage/
          retention-days: 30

  e2e-coverage:
    name: E2E Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with coverage
        run: npm run test:e2e:coverage

      - name: Upload E2E coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-coverage-report
          path: manager/frontend/coverage-e2e/
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: manager/frontend/playwright-report/
          retention-days: 30

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: manager/frontend/test-results/
          retention-days: 7

  merge-coverage:
    name: Merge Coverage Reports
    runs-on: ubuntu-latest
    needs: [coverage, e2e-coverage]
    if: ${{ !cancelled() && (needs.coverage.result == 'success' || needs.e2e-coverage.result == 'success') }}
    defaults:
      run:
        working-directory: manager/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-report
          path: manager/frontend/.nyc_output/unit

      - name: Download E2E coverage
        uses: actions/download-artifact@v4
        with:
          name: e2e-coverage-report
          path: manager/frontend/.nyc_output/e2e

      - name: Merge coverage reports
        run: |
          mkdir -p .nyc_output/merged
          # Copy coverage JSON files to merged directory
          cp .nyc_output/unit/coverage-final.json .nyc_output/merged/unit.json 2>/dev/null || true
          cp .nyc_output/e2e/coverage-final.json .nyc_output/merged/e2e.json 2>/dev/null || true
          # Merge and generate reports
          npx nyc merge .nyc_output/merged .nyc_output/coverage.json
          npx nyc report --reporter=lcov --reporter=text --reporter=text-summary --reporter=html --report-dir=coverage-merged --temp-dir=.nyc_output

      - name: Upload merged coverage report
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report
          path: manager/frontend/coverage-merged/
          retention-days: 30
