name: Backend Lint

on:
  push:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - '.github/workflows/backend-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - '.github/workflows/backend-lint.yml'

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    container:
      image: ghcr.io/gleam-lang/gleam:v1.14.0-erlang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: gleam format --check src test
