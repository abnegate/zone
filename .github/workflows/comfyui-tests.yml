name: ComfyUI Tests

on:
  push:
    branches: [main]
    paths:
      - 'comfyui/**'
      - 'runner/Cargo.lock'
      - 'runner/zone_server/src/services/comfy/**'
      - 'scripts/setup-comfyui-macos.sh'
      - 'scripts/comfyui-loopback-bridge.py'
      # tests/test_comfy_stub.py pins the live rig's ComfyUI stand-in against
      # the shipped workflows, so a change to the stand-in has to run it.
      - 'scripts/live-verify/comfy-stub.py'
      - '.github/workflows/comfyui-tests.yml'
  pull_request:
    paths:
      - 'comfyui/**'
      - 'runner/Cargo.lock'
      - 'runner/zone_server/src/services/comfy/**'
      - 'scripts/setup-comfyui-macos.sh'
      - 'scripts/comfyui-loopback-bridge.py'
      # tests/test_comfy_stub.py pins the live rig's ComfyUI stand-in against
      # the shipped workflows, so a change to the stand-in has to run it.
      - 'scripts/live-verify/comfy-stub.py'
      - '.github/workflows/comfyui-tests.yml'

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: comfyui/requirements-ci.lock

      - name: Read pinned ComfyUI commit
        id: comfyui
        run: |
          commit=$(sed -n 's/^COMFYUI_COMMIT="\(.*\)"$/\1/p' scripts/setup-comfyui-macos.sh)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "COMFYUI_COMMIT must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Cache ComfyUI checkout
        id: comfyui-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .comfyui-runtime
          key: comfyui-${{ steps.comfyui.outputs.commit }}

      - name: Fetch ComfyUI
        if: steps.comfyui-cache.outputs.cache-hit != 'true'
        env:
          COMFYUI_COMMIT: ${{ steps.comfyui.outputs.commit }}
        run: |
          git init .comfyui-runtime
          git -C .comfyui-runtime remote add origin https://github.com/comfyanonymous/ComfyUI.git
          git -C .comfyui-runtime fetch --depth 1 origin "$COMFYUI_COMMIT"
          git -C .comfyui-runtime checkout FETCH_HEAD

      - name: Verify exact ComfyUI revision
        env:
          COMFYUI_COMMIT: ${{ steps.comfyui.outputs.commit }}
        run: test "$(git -C .comfyui-runtime rev-parse HEAD)" = "$COMFYUI_COMMIT"

      - name: Install repository extension
        run: |
          rm -rf .comfyui-runtime/custom_nodes/zone_lora
          cp -R comfyui/custom_nodes/zone_lora .comfyui-runtime/custom_nodes/zone_lora

      - name: Fetch locked abnegate-comfy source
        run: |
          locked=$(python - <<'PY'
          import re
          import sys
          import tomllib

          with open('runner/Cargo.lock', 'rb') as lock:
              packages = [
                  package
                  for package in tomllib.load(lock).get('package', [])
                  if package['name'] == 'abnegate-comfy'
              ]
          if len(packages) != 1:
              sys.exit(f'runner/Cargo.lock locks {len(packages)} abnegate-comfy, expected one')
          version = packages[0]['version']
          checksum = packages[0].get('checksum', '')
          if not re.fullmatch(r'[0-9A-Za-z.+-]+', version):
              sys.exit(f'runner/Cargo.lock locks abnegate-comfy at an unusable version {version!r}')
          if not re.fullmatch(r'[0-9a-f]{64}', checksum):
              sys.exit('runner/Cargo.lock has no crates.io checksum for abnegate-comfy')
          print(version, checksum)
          PY
          )
          read -r version checksum <<< "$locked"
          archive="$RUNNER_TEMP/abnegate-comfy-$version.crate"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://static.crates.io/crates/abnegate-comfy/abnegate-comfy-$version.crate"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/crates"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/crates"
          test -f "$RUNNER_TEMP/crates/abnegate-comfy-$version/src/lib.rs"
          printf 'ABNEGATE_COMFY_SOURCE=%s\n' "$RUNNER_TEMP/crates/abnegate-comfy-$version" >> "$GITHUB_ENV"

      - name: Install locked ComfyUI requirements
        run: >-
          python -m pip install --require-hashes
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          -r comfyui/requirements-ci.lock

      - name: Run tests
        env:
          COMFYUI_INSTALL_DIR: ${{ github.workspace }}/.comfyui-runtime
        run: python -m unittest discover -s tests -v
        working-directory: comfyui
