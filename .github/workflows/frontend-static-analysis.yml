name: Frontend Static Analysis

on:
  push:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - '.github/workflows/frontend-static-analysis.yml'
  pull_request:
    paths:
      - 'manager/frontend/**'
      - '.github/workflows/frontend-static-analysis.yml'

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: manager/frontend
        run: bun run typecheck

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: manager/frontend
        run: bun run build
        env:
          CI: true
