name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - 'installer/frontend/**'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - 'installer/frontend/**'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse-manager:
    name: Lighthouse - Manager Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/frontend/package-lock.json

      - name: Install dependencies
        working-directory: manager/frontend
        run: npm ci

      - name: Build manager frontend
        working-directory: manager/frontend
        run: npm run build
        env:
          CI: false

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./manager/frontend/lighthouserc.json

  lighthouse-installer:
    name: Lighthouse - Installer Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: installer/frontend/package-lock.json

      - name: Install dependencies
        working-directory: installer/frontend
        run: npm ci

      - name: Build installer frontend
        working-directory: installer/frontend
        run: npm run build
        env:
          CI: false

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./installer/frontend/lighthouserc.json
