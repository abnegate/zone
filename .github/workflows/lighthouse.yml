name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'manager/frontend/**'
      - 'packages/ui/**'
      - 'bun.lock'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - 'packages/ui/**'
      - 'bun.lock'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse-manager:
    name: Lighthouse - Manager Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build manager frontend
        working-directory: manager/frontend
        run: bun run build
        env:
          CI: false

      - name: Expose manager build to Lighthouse
        run: ln -s manager/frontend/build build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          temporaryPublicStorage: true
          configPath: ./manager/frontend/lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-results
          path: .lighthouseci
          include-hidden-files: true
