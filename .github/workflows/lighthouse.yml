name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'manager/frontend/**'
      - 'installer/frontend/**'
      - '.github/workflows/lighthouse.yml'
  push:
    branches: [main]
    paths:
      - 'manager/frontend/**'
      - 'installer/frontend/**'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse-manager:
    name: Lighthouse - Manager Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build manager frontend
        working-directory: manager/frontend
        run: bun run build
        env:
          CI: false

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./manager/frontend/lighthouserc.json

  lighthouse-installer:
    name: Lighthouse - Installer Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build installer frontend
        working-directory: installer/frontend
        run: bun run build
        env:
          CI: false

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./installer/frontend/lighthouserc.json
