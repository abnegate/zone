name: Bundle Images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bundle-images.txt'
      - 'scripts/test-bundle-images.py'
      - 'docker-compose*.yml'
      - 'helm/**'
      - '.github/workflows/bundle-images.yml'
  pull_request:
    paths:
      - 'scripts/bundle-images.txt'
      - 'scripts/test-bundle-images.py'
      - 'docker-compose*.yml'
      - 'helm/**'
      - '.github/workflows/bundle-images.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Bundle image list matches Compose and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3

      - name: Show the renderers
        run: |
          docker compose version
          helm version --short

      - name: Check the bundle image list
        run: python scripts/test-bundle-images.py -v
