name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - 'manager/gleam.toml'
      - 'manager/migrations/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - 'manager/gleam.toml'
      - 'manager/migrations/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    name: Gleam Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zone
          POSTGRES_PASSWORD: zone
          POSTGRES_DB: zone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: ghcr.io/gleam-lang/gleam:v1.14.0-erlang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run database migrations
        run: |
          apt-get update && apt-get install -y postgresql-client
          for migration in migrations/*.sql; do
            PGPASSWORD=zone psql -h postgres -U zone -d zone < "$migration"
          done

      - name: Download dependencies
        run: gleam deps download

      - name: Verify SQL module is up to date
        run: |
          cp src/database/queries/sql.gleam src/database/queries/sql.gleam.committed
          DATABASE_URL="postgresql://zone:zone@postgres:5432/zone" gleam run -m squirrel
          if ! diff -q src/database/queries/sql.gleam src/database/queries/sql.gleam.committed > /dev/null 2>&1; then
            echo "::error::SQL module is out of date! Run 'make generate-sql' locally and commit the changes."
            echo ""
            echo "Diff between committed and generated:"
            diff src/database/queries/sql.gleam.committed src/database/queries/sql.gleam || true
            exit 1
          fi
          echo "✓ SQL module is up to date"

      - name: Build project
        run: gleam build

      - name: Run tests
        run: gleam test
        env:
          TEST_POSTGRES_HOST: postgres
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_DB: zone
          TEST_POSTGRES_USER: zone
          TEST_POSTGRES_PASSWORD: zone
          TEST_REDIS_HOST: redis
          TEST_REDIS_PORT: 6379
