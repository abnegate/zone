name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - 'manager/gleam.toml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - 'manager/gleam.toml'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    name: Gleam Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    container:
      image: ghcr.io/gleam-lang/gleam:v1.14.0-erlang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dependencies
        run: gleam deps download

      - name: Build project
        run: gleam build

      - name: Run tests
        run: gleam test
