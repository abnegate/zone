name: Backend Static Analysis

on:
  push:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - 'manager/gleam.toml'
      - '.github/workflows/backend-static-analysis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager/src/**'
      - 'manager/test/**'
      - 'manager/gleam.toml'
      - '.github/workflows/backend-static-analysis.yml'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    container:
      image: ghcr.io/gleam-lang/gleam:v1.14.0-erlang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dependencies
        run: gleam deps download

      - name: Type check
        run: gleam check

  warnings:
    name: Check for Warnings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    container:
      image: ghcr.io/gleam-lang/gleam:v1.14.0-erlang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dependencies
        run: gleam deps download

      - name: Build and check for warnings
        run: |
          # Capture build output and check for warnings
          OUTPUT=$(gleam build 2>&1)
          echo "$OUTPUT"

          # Fail if there are warnings (excluding deprecation warnings from dependencies)
          if echo "$OUTPUT" | grep -E "^warning:" | grep -v "build/packages"; then
            echo "::error::Build produced warnings in source code"
            exit 1
          fi

  unused-code:
    name: Check Unused Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    container:
      image: ghcr.io/gleam-lang/gleam:v1.14.0-erlang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dependencies
        run: gleam deps download

      - name: Check for unused imports and variables
        run: |
          OUTPUT=$(gleam build 2>&1)
          echo "$OUTPUT"

          # Check for unused warnings in our source files
          if echo "$OUTPUT" | grep -E "(Unused imported|Unused private|Unused variable)" | grep -E "^\s+┌─ /app/(src|test)/"; then
            echo "::error::Found unused code"
            exit 1
          fi
