name: Frontend Lint

on:
  push:
    branches: [main]
    paths:
      - 'manager/frontend/src/**'
      - 'manager/frontend/biome.json'
      - 'manager/frontend/package.json'
      - '.github/workflows/frontend-lint.yml'
  pull_request:
    paths:
      - 'manager/frontend/src/**'
      - 'manager/frontend/biome.json'
      - 'manager/frontend/package.json'
      - '.github/workflows/frontend-lint.yml'

jobs:
  biome:
    name: Biome Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome lint
        working-directory: manager/frontend
        run: biome lint src

  biome-format:
    name: Biome Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Check formatting
        working-directory: manager/frontend
        run: biome format --check src

  biome-imports:
    name: Import Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Check import organization
        working-directory: manager/frontend
        run: biome check --linter-enabled=false --formatter-enabled=false src

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        working-directory: manager/frontend
        run: bun run audit
