name: Frontend Lint

on:
  push:
    branches: [main]
    paths:
      - 'manager/frontend/src/**'
      - 'manager/frontend/biome.json'
      - 'manager/frontend/package.json'
      - '.github/workflows/frontend-lint.yml'
  pull_request:
    paths:
      - 'manager/frontend/src/**'
      - 'manager/frontend/biome.json'
      - 'manager/frontend/package.json'
      - '.github/workflows/frontend-lint.yml'

jobs:
  biome:
    name: Biome Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.12

      - name: Run Biome lint
        working-directory: manager/frontend
        run: biome lint src

  biome-format:
    name: Biome Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.12

      - name: Check formatting
        working-directory: manager/frontend
        run: biome format src

  biome-imports:
    name: Import Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.12

      - name: Check import organization
        working-directory: manager/frontend
        run: biome check --linter-enabled=false --formatter-enabled=false src

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        working-directory: manager/frontend
        run: |
          for i in 1 2 3 4; do
            bun run audit && exit 0
            echo "npm audit registry returned an error (attempt $i), retrying..."
            sleep $((i * 15))
          done
          bun run audit
