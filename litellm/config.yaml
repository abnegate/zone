# LiteLLM Proxy Configuration with Auto Routing
# Documentation: https://docs.litellm.ai/docs/proxy/auto_routing

model_list:
  # ===========================================================================
  # Auto Router - Automatically routes based on query complexity
  # This is the model you should use in Open WebUI for automatic routing
  # ===========================================================================
  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router
      auto_router_config_path: /app/router.json
      auto_router_default_model: fast
      auto_router_embedding_model: embed
    model_info:
      id: auto
      mode: chat

  # ===========================================================================
  # Fast Model - For simple queries
  # ===========================================================================
  - model_name: fast
    litellm_params:
      model: ollama/${OLLAMA_FAST_MODEL}
      api_base: http://ollama:11434
      timeout: 60
    model_info:
      id: fast
      mode: chat

  # ===========================================================================
  # Reasoning Model - For complex analysis
  # ===========================================================================
  - model_name: reason
    litellm_params:
      model: ollama/${OLLAMA_REASON_MODEL}
      api_base: http://ollama:11434
      timeout: 180
    model_info:
      id: reason
      mode: chat

  # ===========================================================================
  # Embedding Model - For semantic search and routing
  # ===========================================================================
  - model_name: embed
    litellm_params:
      model: ollama/${OLLAMA_EMBED_MODEL}
      api_base: http://ollama:11434
      timeout: 30
    model_info:
      id: embed
      mode: embedding

# =============================================================================
# Router Configuration
# =============================================================================
router_settings:
  # Retry failed requests
  num_retries: 2

  # Timeout for requests (seconds)
  timeout: 180

  # Routing strategy for non-auto models
  routing_strategy: usage-based-routing

  # Automatic fallbacks for reliability
  fallbacks:
    - fast: [reason]
    - auto: [reason]

# =============================================================================
# General Settings
# =============================================================================
general_settings:
  # Master key for API authentication
  master_key: ${LITELLM_MASTER_KEY}

  # Default model when not specified (use auto for intelligent routing)
  default_model: auto

  # Logging
  litellm_settings:
    drop_params: true
    set_verbose: false
