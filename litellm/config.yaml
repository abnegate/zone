# LiteLLM Proxy Configuration
# Documentation: https://docs.litellm.ai/docs/

model_list:
  # ===========================================================================
  # Fast Model - For simple queries (default)
  # ===========================================================================
  - model_name: fast
    litellm_params:
      model: ollama/${OLLAMA_FAST_MODEL}
      api_base: http://ollama:11434
      timeout: 60
    model_info:
      id: fast
      mode: chat

  # ===========================================================================
  # Reasoning Model - For complex analysis
  # ===========================================================================
  - model_name: reason
    litellm_params:
      model: ollama/${OLLAMA_REASON_MODEL}
      api_base: http://ollama:11434
      timeout: 180
    model_info:
      id: reason
      mode: chat

  # ===========================================================================
  # Embedding Model - For semantic search and routing
  # ===========================================================================
  - model_name: embed
    litellm_params:
      model: ollama/${OLLAMA_EMBED_MODEL}
      api_base: http://ollama:11434
      timeout: 30
    model_info:
      id: embed
      mode: embedding

# =============================================================================
# Router Configuration
# =============================================================================
router_settings:
  # Retry failed requests
  num_retries: 2

  # Timeout for requests (seconds)
  timeout: 180

  # Routing strategy for non-auto models
  routing_strategy: usage-based-routing

  # Automatic fallbacks for reliability
  fallbacks:
    - fast: [reason]
    - auto: [reason]

# =============================================================================
# General Settings
# =============================================================================
general_settings:
  # Master key for API authentication
  master_key: ${SECURITY_LITELLM_MASTER_KEY}

  # Allow master key to be used directly (no virtual keys required)
  disable_spend_logs: true

  # Don't require database lookup for master key
  master_key_hash_auth: true

  # Default model when not specified
  default_model: fast

  # Don't persist models to database - models defined in config.yaml
  store_model_in_db: false
  use_azure_key_vault: false

  # Logging
  litellm_settings:
    drop_params: true
    set_verbose: false
