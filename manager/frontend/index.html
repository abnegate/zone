<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="description" content="Zone Dashboard - AI Infrastructure Management" />

    <!-- Preconnect to external domains for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts with optimal loading strategy -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@500;600&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet" />
    </noscript>

    <!-- PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zone" />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />

    <!-- DNS prefetch for API endpoints (adjust domain as needed) -->
    <link rel="dns-prefetch" href="//api.zone.local" />

    <title>Zone</title>

    <!-- Critical inline styles for immediate render -->
    <style>
      /* Prevent FOUT with fallback fonts */
      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #121214;
        color: #fafaf9;
        margin: 0;
      }
      /* Initial loading state */
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-spinner {
        display: block;
        width: 40px;
        height: 40px;
        border: 3px solid #232326;
        border-top-color: #ed7a14;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-title { font-family: 'Fraunces', serif; font-size: 48px; margin: 0 0 24px 0; color: #ed7a14; }
      .loader-text { margin-top: 16px; font-size: 14px; color: #71717a; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="initial-loader" aria-label="Loading">
        <h1 class="loader-title">Zone</h1>
        <span class="loader-spinner"></span>
        <p class="loader-text">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
