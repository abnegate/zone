<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <meta
      name="description"
      content="Zone Dashboard - AI Infrastructure Management"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=Lato:wght@400;700&family=Nunito:wght@400;500;600;700&display=swap"
    />

    <!-- PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Zone" />

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />

    <!-- DNS prefetch for API endpoints (adjust domain as needed) -->
    <link rel="dns-prefetch" href="//api.zone.local" />

    <title>Zone</title>

    <!-- Critical inline styles for immediate render -->
    <style>
      /* Prevent FOUT with fallback fonts */
      body {
        font-family: var(
          --ui-font-body,
          'Source Sans 3',
          ui-sans-serif,
          system-ui,
          sans-serif
        );
        background: var(--ui-bg-base, #f4f0e8);
        color: var(--ui-text-primary, #1a1612);
        margin: 0;
      }
      /* Initial loading state */
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-spinner {
        display: block;
        width: 40px;
        height: 40px;
        border: 3px solid #d4cbb8;
        border-top-color: #a3481d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loader-title {
        font-family: 'Newsreader', Georgia, serif;
        font-size: 48px;
        font-weight: 600;
        margin: 0 0 24px 0;
        color: var(--ui-text-primary, #1a1612);
        letter-spacing: -0.02em;
      }
      .loader-text {
        margin-top: 16px;
        font-size: 14px;
        color: #534b42;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="initial-loader" aria-label="Loading">
        <h1 class="loader-title">Zone</h1>
        <span class="loader-spinner"></span>
        <p class="loader-text">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
