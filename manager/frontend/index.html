<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Zone Dashboard - AI Infrastructure Management"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Zone" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />


    <title>Zone</title>

    <style>
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --ui-bg-base: #0e0c0a;
          --ui-text-primary: #f3eee6;
          --ui-text-secondary: #c4b8a8;
          --ui-border: #2e2923;
        }
        :root:not([data-theme]) .loader-spinner {
          border-top-color: #00f3ff;
        }
      }
      body {
        font-family: var(
          --ui-font-body,
          "Nunito",
          system-ui,
          sans-serif
        );
        background: var(--ui-bg-base, #f4f0e8);
        color: var(--ui-text-primary, #1a1612);
        margin: 0;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-spinner {
        display: block;
        width: var(--ui-space-10, 2.5rem);
        height: var(--ui-space-10, 2.5rem);
        border: 3px solid var(--ui-border, #d4cbb8);
        border-top-color: #0011d9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loader-title {
        font-family: "Nunito", system-ui, sans-serif;
        font-size: var(--ui-auth-title-size, 1.875rem);
        font-weight: 600;
        margin: 0 0 24px 0;
        color: var(--ui-text-primary, #1a1612);
        letter-spacing: var(--ui-tracking-tight, -0.025em);
      }
      .loader-text {
        margin-top: 16px;
        font-size: var(--ui-text-sm, 0.875rem);
        color: var(--ui-text-secondary, #534b42);
      }
      [data-shell] #root > .initial-loader {
        position: absolute;
        width: 1px;
        height: 1px;
        min-height: 0;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      [data-shell] #root > .initial-loader .loader-spinner {
        animation: none;
      }
    </style>
  </head>
  <body>
    <!--signed-out-shell-->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="initial-loader" role="status" aria-label="Loading">
        <h1 class="loader-title">Zone</h1>
        <span class="loader-spinner"></span>
        <p class="loader-text">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
