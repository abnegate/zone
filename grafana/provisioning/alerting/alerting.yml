# Grafana Alerting Provisioning
# Contact points and notification policies.
#
# grafana/entrypoint.sh rewrites this at start:
#   - email when ALERT_ENABLED=true (needs SMTP)
#   - Discord when ALERT_DISCORD_WEBHOOK_URL is set (no SMTP)
# Discord mobile notifications are the push path.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-notifications
    receivers:
      - uid: email-receiver
        type: email
        settings:
          addresses: ${ALERT_EMAIL_RECIPIENTS}
          singleEmail: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: email-notifications
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
