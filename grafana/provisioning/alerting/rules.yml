                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Valkey cache is down
          description: Valkey cache has been unreachable for more than 2 minutes.
        labels:
          severity: critical
          service: valkey

      - uid: ollama-down
        title: Ollama LLM Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="ollama"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: replaceNN
                replaceWithValue: 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Ollama LLM service is down
          description: Ollama has been unreachable for more than 5 minutes. AI inference is unavailable.
        labels:
