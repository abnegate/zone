  # =============================================================================
  # Performance Alerts
  # =============================================================================
  - orgId: 1
    name: Performance
    folder: Zone Alerts
    interval: 1m
    rules:
      - uid: manager-high-latency
        title: Manager High Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="manager", path!~"/health|/metrics"}[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Manager P95 latency is high
          description: The 95th percentile latency for the Manager service has exceeded 2 seconds for 5 minutes.
        labels:
          severity: warning
          service: manager

      - uid: manager-high-error-rate
        title: Manager High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(http_requests_total{job="manager", status=~"5.."}[5m])) / sum(rate(http_requests_total{job="manager"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Manager has high 5xx error rate
          description: More than 5% of requests to the Manager service are returning 5xx errors.
        labels:
          severity: warning
          service: manager

      - uid: traefik-high-error-rate
        title: Traefik High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Traefik has high 5xx error rate
          description: More than 5% of requests through Traefik are returning 5xx errors.
        labels:
          severity: warning
          service: traefik

  # =============================================================================
  # Database Alerts
  # =============================================================================
  - orgId: 1
    name: Database
    folder: Zone Alerts
    interval: 1m
    rules:
      - uid: postgres-too-many-connections
        title: PostgreSQL High Connection Count
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: pg_stat_activity_count
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: PostgreSQL has too many connections
          description: PostgreSQL has more than 80 active connections. Default max is 100.
        labels:
          severity: warning
          service: postgres

      - uid: postgres-low-cache-hit
        title: PostgreSQL Low Cache Hit Ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0.90
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: PostgreSQL cache hit ratio is low
          description: PostgreSQL buffer cache hit ratio is below 90%. Consider increasing shared_buffers.
        labels:
          severity: warning
          service: postgres

