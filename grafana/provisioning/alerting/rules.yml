# Grafana Alert Rules Provisioning
# Critical alerts for Zone AI Stack infrastructure
#
# Grafana 11+ unified alerting cannot use a raw Prometheus range/instant
# series as the condition ("only reduced data can be alerted on"). Each
# rule is: PromQL (A) → last() (B) → threshold (C).
#
# Availability queries `up{job}` (not `up == 0`). A healthy target is 1;
# down or vanished is 0 after last() replaceNN. NoData on `up == 0` was
# empty-when-healthy and false-fired when noDataState was Alerting.

apiVersion: 1

groups:
  # =============================================================================
  # Service Availability Alerts
  # =============================================================================
  - orgId: 1
    name: Service Availability
    folder: Zone Alerts
    interval: 1m
    rules:
      - uid: manager-down
        title: Manager Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="manager"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: replaceNN
                replaceWithValue: 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Manager service is down
          description: The Manager service has been unreachable for more than 2 minutes.
        labels:
          severity: critical
          service: manager

      - uid: traefik-down
        title: Traefik Reverse Proxy Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="traefik"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: replaceNN
                replaceWithValue: 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Traefik reverse proxy is down
          description: Traefik has been unreachable for more than 2 minutes. All services may be inaccessible.
        labels:
          severity: critical
          service: traefik

      - uid: postgres-down
        title: PostgreSQL Database Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="postgres"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
