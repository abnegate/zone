# Development overrides with hot reload for Rust and Vite
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  postgres:
    command: postgres -c max_connections=255 -c maintenance_work_mem=2GB
    networks:
      - internal
      - edge
    ports:
      - "5432:5432"

  valkey:
    networks:
      - internal
      - edge
    ports:
      - "6379:6379"

  manager:
    image: zone-manager:dev
    build:
      context: .
      dockerfile: manager/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Mount Rust source code for hot reload
      - ./runner:/app/runner:cached
      # Persist cargo cache for faster rebuilds
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/app/runner/target
      - embed-cache:/app/embed-cache
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/${MANAGER_POSTGRES_DB:-manager}
      - REDIS_URL=redis://valkey:6379
      - LITELLM_HOST=http://litellm:4000
      - LITELLM_KEY=${SECURITY_LITELLM_MASTER_KEY}
      - OLLAMA_HOST=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_ENGINE=${EMBEDDING_ENGINE:-ollama}
      - ZONE_EMBED_CACHE_DIR=/app/embed-cache
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGINS=http://localhost:3001,http://console:3001
      - SQLX_OFFLINE=true
      - RUST_LOG=zone_server=debug,zone_core=debug,zone_context=debug
      - RUST_BACKTRACE=1
      - SEARCH_ENABLE_WEB_SEARCH=${SEARCH_ENABLE_WEB_SEARCH:-true}
      - "SEARCH_SEARXNG_QUERY_URL=${SEARCH_SEARXNG_QUERY_URL:-http://gluetun:8080/search?q=<query>&format=json}"
      - SEARCH_RESULT_COUNT=${SEARCH_RESULT_COUNT:-5}
      - MODEL_SEARCH_PROXY_URL=${MODEL_SEARCH_PROXY_URL:-}
      - TOOL_RUNNER_PROXY_URL=${TOOL_RUNNER_PROXY_URL:-}
      - ZONE_MCP_ENABLED=${ZONE_MCP_ENABLED:-true}
      - ZONE_MCP_AUTO_MAGENTS=${ZONE_MCP_AUTO_MAGENTS:-true}
      - ZONE_MCP_CONFIG=${ZONE_MCP_CONFIG:-}
      - ZONE_MCP_SERVERS=${ZONE_MCP_SERVERS:-}
      - MONITORING_ENABLED=${MONITORING_ENABLED:-true}
      - MONITORING_PROMETHEUS_URL=${MONITORING_PROMETHEUS_URL:-http://prometheus:9090}
      - MONITORING_GRAFANA_URL=${MONITORING_GRAFANA_URL:-http://grafana:3000}
      - MONITORING_GRAFANA_ADMIN_USER=${MONITORING_GRAFANA_ADMIN_USER:-admin}
      - MONITORING_GRAFANA_ADMIN_PASSWORD=${MONITORING_GRAFANA_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Relax health check for development (rebuilds take time)
      test: ["CMD", "true"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  console:
    image: zone-console:dev
    build:
      context: .
      dockerfile: manager/frontend/Dockerfile.dev
    init: true
    ports:
      - "3001:3001"
    volumes:
      - ./manager/frontend/src:/workspace/manager/frontend/src
      - ./manager/frontend/public:/workspace/manager/frontend/public
      - ./manager/frontend/index.html:/workspace/manager/frontend/index.html
      - ./manager/frontend/vite.config.ts:/workspace/manager/frontend/vite.config.ts
      - ./manager/frontend/tsconfig.json:/workspace/manager/frontend/tsconfig.json
      - ./packages/ui/src:/workspace/packages/ui/src
      - console-workspace-modules:/workspace/node_modules
    environment:
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://manager:8000
      - VITE_USE_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    networks:
      - edge
      - internal
    depends_on:
      manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  internal:
    name: zone_internal
  edge:
    name: zone_edge

volumes:
  cargo-registry:
    name: zone_dev_cargo_registry
  cargo-git:
    name: zone_dev_cargo_git
  cargo-target:
    name: zone_dev_cargo_target
  embed-cache:
    name: zone_dev_embed_cache
  console-workspace-modules:
    name: zone_dev_console_workspace_modules
