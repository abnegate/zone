services:
  # =============================================================================
  # Data Storage
  # =============================================================================
  postgres:
    command: postgres -c max_connections=255
    networks:
      - internal
      - edge
    ports:
      - "5432:5432"

  valkey:
    networks:
      - internal
      - edge
    ports:
      - "6379:6379"

  manager:
    ports:
      - "8000:8000"

  console:
    image: oven/bun:1-alpine
    container_name: console
    restart: unless-stopped
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./manager/frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "bun install && bun start"
    ports:
      - "3000:3000"

networks:
  internal:
    name: zone_internal
  edge:
    name: zone_edge

volumes:
  frontend_node_modules:
    name: zone_frontend_node_modules
