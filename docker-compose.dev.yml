# Development overrides
# Frontend runs locally for best DX: cd manager/frontend && bun install && bun start

services:
  postgres:
    command: postgres -c max_connections=255
    networks:
      - internal
      - edge
    ports:
      - "5432:5432"

  valkey:
    networks:
      - internal
      - edge
    ports:
      - "6379:6379"

  manager:
    ports:
      - "8000:8000"

  console:
    profiles:
      - disabled

networks:
  internal:
    name: zone_internal
  edge:
    name: zone_edge
