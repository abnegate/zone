{{- if .Values.networkPolicy.enabled }}
---
# Default deny all traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-server.fullname" . }}-default-deny
  labels:
    {{- include "zone-server.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# Allow ingress to server from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-server.fullname" . }}-server-ingress
  labels:
    {{- include "zone-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-server.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.service.port }}
---
# Allow egress from server to database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-server.fullname" . }}-server-egress
  labels:
    {{- include "zone-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-server.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow database connections
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- if not .Values.global.externalDatabase }}
    # Allow connections to in-cluster postgres
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
---
# Allow ingress to manager from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-server.fullname" . }}-manager-ingress
  labels:
    {{- include "zone-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-server.manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.manager.service.port }}
---
# Allow egress from manager (for external resources like CDNs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-server.fullname" . }}-manager-egress
  labels:
    {{- include "zone-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-server.manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for external resources (CDNs, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
