# The supported high-availability topology for zone-ai. Layer it over your
# own values:
#
#   helm upgrade --install zone-ai helm/zone-ai -f helm/zone-ai/values-ha.yaml
#
# Zone issues LiteLLM keys with no budget, rpm or tpm limits, so replicas share
# nothing but the database and need no LiteLLM Redis. A killed replica loses
# the spend logs it had not flushed yet. Ollama is outside the supported
# topology and keeps a single replica.

litellm:
  replicas: 2

  # The master and each of the 4 workers is a Python process of about 1 GiB.
  resources:
    requests:
      memory: "4Gi"
    limits:
      memory: "6Gi"

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
          topologyKey: kubernetes.io/hostname
