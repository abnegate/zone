# Zone AI Services - Values
# Ollama and LiteLLM configuration

global:
  namespace: zone

# Ollama LLM inference
ollama:
  enabled: true

  image:
    repository: ollama/ollama
    tag: "0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2"
    pullPolicy: IfNotPresent

  config:
    host: "0.0.0.0:11434"
    keepAlive: "24h"
    maxLoadedModels: "3"

  models:
    - nomic-embed-text
    - llama3.1:8b

  init:
    enabled: true
    image:
      repository: curlimages/curl
      tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    # Official ollama image stores models under /root/.ollama and runs as root.
    mountPath: /root/.ollama

  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "16Gi"
      cpu: "4000m"

  # Official image is rootful; non-root breaks model storage.
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    fsGroup: 0

  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30

# LiteLLM proxy
litellm:
  enabled: true

  image:
    repository: ghcr.io/berriai/litellm
    tag: "v1.99.1@sha256:a53a7d3ffebede1925bd3ee8a21e4a7b9b63e2e68ec883af136edcccb6eeb82c"
    pullPolicy: IfNotPresent

  workers: 4

  models:
    - name: "llama3.1:8b"
      provider: ollama_chat
      timeout: 60
    - name: "nomic-embed-text"
      provider: ollama
      timeout: 30

  defaultModel: "llama3.1:8b"

  router:
    retries: 2
    timeout: 180

  secrets:
    existingSecret: "zone-secrets"
    masterKeyKey: "litellm-master-key"
    saltKeyKey: "litellm-salt-key"
    databaseUrlKey: "litellm-database-url"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
