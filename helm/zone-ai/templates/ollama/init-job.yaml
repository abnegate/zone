{{- if and .Values.ollama.enabled .Values.ollama.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init-{{ .Values.ollama.models | toJson | sha256sum | trunc 10 }}
  namespace: {{ include "zone-ai.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "zone-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: initialization
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama-init
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.ollama.init.image.repository }}:{{ .Values.ollama.init.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for Ollama to be ready..."
              until curl -f -s http://ollama:11434/api/tags > /dev/null 2>&1; do
                echo "Ollama not ready yet, waiting..."
                sleep 5
              done
              echo "Ollama is ready. Pulling models..."

              {{- range .Values.ollama.models }}
              echo "Pulling configured model..."
              curl -f --retry 5 --retry-delay 5 -X POST http://ollama:11434/api/pull --data-binary @- <<'JSON'
              {{ dict "name" . | toJson }}
              JSON
              {{- end }}

              echo "Model initialization complete!"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
