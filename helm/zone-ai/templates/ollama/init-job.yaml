{{- if and .Values.ollama.enabled .Values.ollama.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init
  namespace: {{ include "zone-ai.namespace" . }}
  labels:
    {{- include "zone-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: initialization
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama-init
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.ollama.init.image.repository }}:{{ .Values.ollama.init.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for Ollama to be ready..."
              until curl -f -s http://ollama:11434/api/tags > /dev/null 2>&1; do
                echo "Ollama not ready yet, waiting..."
                sleep 5
              done
              echo "Ollama is ready. Pulling models..."

              {{- range .Values.ollama.models }}
              echo "Pulling {{ . }}..."
              curl -f -X POST http://ollama:11434/api/pull -d {{ list "name" . | dict | toJson | squote }}
              {{- end }}

              echo "Model initialization complete!"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
{{- end }}
