{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ include "zone-ai.namespace" . }}
  labels:
    {{- include "zone-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: llm-proxy
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-ollama
          image: "curlimages/curl:8.17.0"
          command:
            - sh
            - -c
            - |
              echo "Waiting for Ollama to be ready..."
              until curl -f -s http://ollama:11434/api/tags > /dev/null 2>&1; do
                echo "Ollama not ready yet, waiting..."
                sleep 2
              done
              echo "Ollama is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: {{ .Values.litellm.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.litellm.securityContext.runAsUser }}
        fsGroup: {{ .Values.litellm.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          args:
            - --config
            - /app/config.yaml
            - --port
            - "4000"
            - --num_workers
            - {{ .Values.litellm.workers | quote }}
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.secrets.existingSecret }}
                  key: {{ .Values.litellm.secrets.masterKeyKey }}
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.secrets.existingSecret }}
                  key: {{ .Values.litellm.secrets.saltKeyKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.secrets.existingSecret }}
                  key: {{ .Values.litellm.secrets.databaseUrlKey }}
            - name: REQUEST_TIMEOUT
              value: "600"
            - name: LITELLM_LOG
              value: "INFO"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.litellm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: litellm-config
{{- end }}
