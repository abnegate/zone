{{- if and .Values.litellm.enabled .Values.litellm.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: {{ include "zone-ai.namespace" . }}
  labels:
    {{- include "zone-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-proxy
spec:
  maxUnavailable: {{ .Values.litellm.podDisruptionBudget.maxUnavailable }}
  {{- with .Values.litellm.podDisruptionBudget.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
{{- end }}
