# Zone Infrastructure - Values
# PostgreSQL (CNPG) and Valkey configuration

global:
  namespace: zone

# PostgreSQL via CloudNativePG
postgres:
  enabled: true

  instances: 1
  # Official CNPG image already ships pgvector. Build postgres/cnpg/Dockerfile
  # if you need a newer extension build.
  image: ghcr.io/cloudnative-pg/postgresql:16.15@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a

  # Application role created by initdb. Credentials come from secrets.existingSecret
  # (must contain username + password).
  database: litellm
  owner: zone

  extraDatabases:
    - manager

  sharedPreloadLibraries: []

  # postgresql.conf settings; CNPG takes every value as a string.
  parameters: {}

  # CNPG spec.postgresql.synchronous, e.g. {method: any, number: 1,
  # dataDurability: required}. number must be below instances.
  synchronous: {}

  # CNPG spec.affinity, e.g. {podAntiAffinityType: required}.
  affinity: {}

  # Barman Cloud plugin backups. Set objectStore to the name of a
  # barmancloud.cnpg.io ObjectStore in this namespace to archive WAL there and
  # take scheduled base backups; empty leaves backups off. schedule has a
  # leading seconds field.
  backup:
    objectStore: ""
    schedule: "0 0 0 * * *"
    target: ""

  # Bootstrap the cluster from backups instead of with initdb, as docs/HA.md
  # describes under Restore order. Set objectStore to the barmancloud.cnpg.io
  # ObjectStore that holds them (never backup.objectStore: a recovered cluster
  # archives into a new one) and serverName to the cluster that took them,
  # zone-postgres for a cluster this chart created. targetTime, an RFC 3339
  # timestamp with its zone, stops the replay there instead of at the end of
  # the archive. Keep these set on every later upgrade of a recovered release,
  # so the running Cluster's bootstrap is never rewritten to initdb.
  recovery:
    objectStore: ""
    serverName: ""
    targetTime: ""

  postInitTemplateSQL:
    - CREATE EXTENSION IF NOT EXISTS vector
    - CREATE EXTENSION IF NOT EXISTS pg_trgm

  superuser:
    create: false
    secretName: zone-postgres-superuser
    username: postgres
    password: ""

  storage:
    size: 10Gi
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  monitoring:
    enabled: false

# Valkey (Redis-compatible cache)
valkey:
  enabled: true

  image:
    repository: valkey/valkey
    tag: "8.1.10-alpine@sha256:b21fd94099dcd4bc6b2b9230daef69b6558b887ad4a2a1afe56ff6e745a88cdb"
    pullPolicy: IfNotPresent

  maxMemory: "256mb"
  maxMemoryPolicy: "allkeys-lru"

  auth:
    enabled: true
    existingSecret: ""
    secretKey: "valkey-password"

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

# Existing Secret used by CNPG (username/password) and Valkey (valkey-password).
# Created by scripts/tilt-up.sh for Kind, or by the operator for other environments.
secrets:
  existingSecret: "zone-secrets"
