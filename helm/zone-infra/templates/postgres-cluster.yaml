{{- if .Values.postgres.enabled }}
{{- $postgres := .Values.postgres }}
{{- if and $postgres.synchronous (ge (int $postgres.synchronous.number) (int $postgres.instances)) }}
{{- fail (printf "postgres.synchronous.number (%v) must be below postgres.instances (%v): CNPG waits on that many standbys" $postgres.synchronous.number $postgres.instances) }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zone-postgres
  namespace: {{ include "zone-infra.namespace" . }}
  labels:
    {{- include "zone-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ $postgres.instances }}

  imageName: {{ $postgres.image }}

  {{- if or $postgres.sharedPreloadLibraries $postgres.parameters $postgres.synchronous }}
  postgresql:
    {{- if $postgres.sharedPreloadLibraries }}
    shared_preload_libraries:
      {{- toYaml $postgres.sharedPreloadLibraries | nindent 6 }}
    {{- end }}
    {{- with $postgres.parameters }}
    parameters:
      {{- range $name, $value := . }}
      {{ $name }}: {{ $value | toString | quote }}
      {{- end }}
    {{- end }}
    {{- with $postgres.synchronous }}
    synchronous:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with $postgres.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $postgres.backup.objectStore }}
  plugins:
    - name: {{ include "zone-infra.barmanCloudPlugin" $ }}
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ . | quote }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ $postgres.database }}
      owner: {{ $postgres.owner }}
      secret:
        name: {{ include "zone-infra.secretsName" . }}
      {{- if $postgres.postInitTemplateSQL }}
      postInitTemplateSQL:
        {{- toYaml $postgres.postInitTemplateSQL | nindent 8 }}
      {{- end }}

  superuserSecret:
    name: {{ $postgres.superuser.secretName }}

  storage:
    size: {{ $postgres.storage.size }}
    {{- if $postgres.storage.storageClass }}
    storageClass: {{ $postgres.storage.storageClass }}
    {{- end }}

  {{- if $postgres.resources }}
  resources:
    {{- toYaml $postgres.resources | nindent 4 }}
  {{- end }}

  monitoring:
    enablePodMonitor: {{ $postgres.monitoring.enabled }}
{{- end }}
