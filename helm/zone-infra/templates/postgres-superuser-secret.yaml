{{- if .Values.postgres.enabled }}
{{- $secretName := "zone-postgres-superuser" }}
{{- $existingSecret := lookup "v1" "Secret" (include "zone-infra.namespace" .) $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "zone-infra.namespace" . }}
  labels:
    {{- include "zone-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  {{- if $existingSecret }}
  password: {{ index $existingSecret.data "password" | b64dec | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | quote }}
  {{- end }}
{{- end }}
