{{- if and .Values.postgres.enabled .Values.postgres.superuser.create }}
{{- if not .Values.postgres.superuser.password }}
{{- fail "postgres.superuser.password is required when postgres.superuser.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.superuser.secretName }}
  namespace: {{ include "zone-infra.namespace" . }}
  labels:
    {{- include "zone-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.superuser.username | quote }}
  password: {{ .Values.postgres.superuser.password | quote }}
{{- end }}
