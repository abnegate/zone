environment: production

global:
  imageRegistry: ""
  imagePullSecrets: []
  externalDatabase: false
  securityContexts: true

initContainers:
  postgres:
    image: "postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b"

image:
  pullPolicy: IfNotPresent

# Non-secret configuration shared by zone-server
commonEnv:
  DB_HOST: "zone-postgres-rw"
  DB_PORT: "5432"
  DB_NAME: "manager"
  DB_USER: "zone"
  RUST_LOG: "info"
  LITELLM_HOST: "http://litellm:4000"
  OLLAMA_HOST: "http://ollama:11434"
  EMBEDDING_ENGINE: "ollama"
  MODEL_SEARCH_PROXY_URL: ""
  TOOL_RUNNER_PROXY_URL: ""
  VALKEY_HOST: "valkey"
  VALKEY_PORT: "6379"

# Prefer an existing Secret (created by tilt-up.sh as zone-secrets).
# Set create=true and fill the values below for a standalone install.
secrets:
  create: false
  existingSecret: "zone-secrets"

  dbPassword: ""
  jwtSecret: ""
  encryptionKey: ""
  litellmMasterKey: ""
  redisPassword: ""
  stripeSecretKey: ""
  smtpPassword: ""

  keys:
    databaseUrl: database-url
    redisUrl: valkey-url
    jwtSecret: jwt-secret
    encryptionKey: encryption-key
    litellmKey: litellm-master-key
    dbPassword: postgres-password

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

# Server is zone-server (Rust API). Image is built from manager/Dockerfile.
server:
  enabled: true
  replicaCount: 2

  image:
    repository: zone/server
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

  env:
    PORT: "8000"
    HOST: "0.0.0.0"

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
          topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: server

# Manager is the React console (static bun serve on 3001).
manager:
  enabled: true
  replicaCount: 2

  image:
    repository: zone/manager
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70

  env:
    PORT: "3001"

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: manager
          topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: manager

ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  hosts:
    - host: zone.local
      paths:
        - path: /api
          pathType: Prefix
          service: server
        - path: /ws
          pathType: Prefix
          service: server
        - path: /
          pathType: Prefix
          service: manager
  tls: []

# zone-server runs sqlx migrations on startup. Leave this disabled.
migration:
  enabled: false

  image:
    repository: zone/server
    tag: latest
    pullPolicy: Always

  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  env: {}

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
  ingressNamespace: haproxy-controller
  # CIDR containing commonEnv.DB_HOST; required for external databases when enabled.
  externalDatabaseCIDR: ""

# Preserve an existing claim when retiring the former chat service.
# A connected Helm upgrade looks up the claim automatically. Offline renderers
# must supply its exact metadata and spec (see helm/QUICK_START.md).
retainedStorage:
  openwebui:
    enabled: false
    metadata: {}
    spec: {}
