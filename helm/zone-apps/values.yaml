environment: production

global:
  imageRegistry: ""
  imagePullSecrets: []
  externalDatabase: false
  securityContexts: true

initContainers:
  postgres:
    image: "postgres:16-alpine"

image:
  pullPolicy: IfNotPresent

# Non-secret configuration shared by zone-server
commonEnv:
  DB_HOST: "zone-postgres-rw"
  DB_PORT: "5432"
  DB_NAME: "manager"
  DB_USER: "zone"
  RUST_LOG: "info"
  LITELLM_HOST: "http://litellm:4000"
  OLLAMA_HOST: "http://ollama:11434"
  EMBEDDING_ENGINE: "ollama"
  VALKEY_HOST: "valkey"
  VALKEY_PORT: "6379"

# Prefer an existing Secret (created by tilt-up.sh as zone-secrets).
# Set create=true and fill the values below for a standalone install.
secrets:
  create: false
  existingSecret: "zone-secrets"

  dbPassword: ""
  jwtSecret: ""
  encryptionKey: ""
  litellmMasterKey: ""
  redisPassword: ""
  stripeSecretKey: ""
  smtpPassword: ""

  keys:
    databaseUrl: database-url
    redisUrl: valkey-url
    jwtSecret: jwt-secret
    encryptionKey: encryption-key
    litellmKey: litellm-master-key
    dbPassword: postgres-password

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  seccompProfile:
    type: RuntimeDefault

# Server is zone-server (Rust API). Image is built from manager/Dockerfile.
server:
  enabled: true
  replicaCount: 2

  image:
    repository: zone/server
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

  env:
    PORT: "8000"
    HOST: "0.0.0.0"

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: server
          topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: server

# Manager is the React console (static bun serve on 3001).
manager:
  enabled: true
  replicaCount: 2

  image:
    repository: zone/manager
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70

  env:
    PORT: "3001"

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: manager
          topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: manager

ingress:
  enabled: true
  className: "haproxy"
  annotations: {}
  hosts:
    - host: zone.local
      paths:
        - path: /api
          pathType: Prefix
          service: server
        - path: /ws
          pathType: Prefix
          service: server
        - path: /
          pathType: Prefix
          service: manager
  tls: []

# zone-server runs sqlx migrations on startup. Leave this disabled.
migration:
  enabled: false

  image:
    repository: zone/server
    tag: latest
    pullPolicy: Always

  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  env: {}

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
  ingressNamespace: haproxy-controller

openwebui:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/open-webui/open-webui
    tag: v0.11.3@sha256:751b617714b91e4cfd0186a509c72480c858e012976103b09a30dad053c36175
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  config:
    auth: true
    signup: true
    ragWebSearch: true
    defaultModels: "llama3.1:8b"
    corsAllowOrigin: "http://localhost:8080,http://webui.localhost"

  litellm:
    host: "http://litellm:4000/v1"
    secretName: "zone-secrets"
    secretKey: "litellm-master-key"

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
