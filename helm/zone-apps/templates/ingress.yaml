{{- if .Values.ingress.enabled -}}
{{- $fullName := include "zone-apps.fullname" . -}}
{{- $serverPort := .Values.server.service.port -}}
{{- $managerPort := .Values.manager.service.port -}}
{{- $annotations := .Values.ingress.annotations | default dict -}}
{{- if and .Values.ingress.className (not (hasKey $annotations "kubernetes.io/ingress.class")) }}
  {{- $annotations = merge $annotations (dict "kubernetes.io/ingress.class" .Values.ingress.className) -}}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}-{{ .service }}
                port:
                  number: {{ if eq .service "server" }}{{ $serverPort }}{{ else if eq .service "manager" }}{{ $managerPort }}{{ end }}
              {{- else }}
              serviceName: {{ $fullName }}-{{ .service }}
              servicePort: {{ if eq .service "server" }}{{ $serverPort }}{{ else if eq .service "manager" }}{{ $managerPort }}{{ end }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
