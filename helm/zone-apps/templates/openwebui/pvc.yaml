{{- $storage := .Values.retainedStorage | default dict -}}
{{- $retention := $storage.openwebui | default dict -}}
{{- $existing := lookup "v1" "PersistentVolumeClaim" .Release.Namespace "openwebui-pvc" -}}
{{- if or $existing $retention.enabled -}}
{{- $metadata := deepCopy ($retention.metadata | default dict) -}}
{{- $spec := $retention.spec -}}
{{- if $existing -}}
{{- $metadata = deepCopy $existing.metadata -}}
{{- $spec = $existing.spec -}}
{{- end -}}
{{- if not $spec -}}
{{- fail "retainedStorage.openwebui.spec must contain the existing claim spec for offline retention" -}}
{{- end -}}
{{- $annotations := $metadata.annotations | default dict -}}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-pvc
  namespace: {{ .Release.Namespace }}
  {{- with $metadata.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- with $metadata.finalizers }}
  finalizers:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $metadata.ownerReferences }}
  ownerReferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
