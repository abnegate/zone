{{- if .Values.openwebui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
spec:
  replicas: {{ .Values.openwebui.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui
        app.kubernetes.io/component: openwebui
        zone.dev/external-access: "true"
    spec:
      serviceAccountName: {{ include "zone-apps.serviceAccountName" . }}
      {{- if .Values.global.securityContexts }}
      securityContext:
        runAsNonRoot: {{ .Values.openwebui.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.openwebui.securityContext.runAsUser }}
        fsGroup: {{ .Values.openwebui.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: openwebui
          {{- if .Values.global.securityContexts }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          {{- end }}
          image: "{{ .Values.openwebui.image.repository }}:{{ .Values.openwebui.image.tag }}"
          imagePullPolicy: {{ .Values.openwebui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.openwebui.service.targetPort }}
              name: http
          env:
            - name: OPENAI_API_BASE_URL
              value: {{ .Values.openwebui.litellm.host | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openwebui.litellm.secretName }}
                  key: {{ .Values.openwebui.litellm.secretKey }}
            - name: WEBUI_AUTH
              value: {{ .Values.openwebui.config.auth | quote }}
            - name: ENABLE_SIGNUP
              value: {{ .Values.openwebui.config.signup | quote }}
            - name: ENABLE_RAG_WEB_SEARCH
              value: {{ .Values.openwebui.config.ragWebSearch | quote }}
            - name: CORS_ALLOW_ORIGIN
              value: {{ .Values.openwebui.config.corsAllowOrigin | quote }}
            - name: DEFAULT_MODELS
              value: {{ .Values.openwebui.config.defaultModels | quote }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          {{- with .Values.openwebui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.openwebui.persistence.enabled }}
          persistentVolumeClaim:
            claimName: openwebui-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
