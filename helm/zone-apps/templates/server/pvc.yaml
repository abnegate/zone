{{- $claim := include "zone-apps.server.agentStateClaim" . }}
{{- if $claim }}
{{- $persistence := .Values.server.agentState.persistence }}
{{- $accessMode := $persistence.accessMode | default "ReadWriteOnce" }}
{{- if and (eq $accessMode "ReadWriteMany") (not $persistence.storageClass) }}
{{- fail "server.agentState.persistence.storageClass must name a ReadWriteMany storage class (NFSv4.1+, EFS, Filestore, Azure Files NFS or CephFS) when accessMode is ReadWriteMany" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels:
    {{- include "zone-apps.server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ $accessMode }}
  {{- with $persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
