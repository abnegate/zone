{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zone-apps.fullname" . }}-server
  labels:
    {{- include "zone-apps.server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zone-apps.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.service.port | quote }}
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "zone-apps.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zone-apps.serviceAccountName" . }}
      {{- if .Values.global.securityContexts }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if not .Values.global.externalDatabase }}
      initContainers:
        - name: wait-for-database
          image: {{ .Values.initContainers.postgres.image | default "postgres:15-alpine" }}
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h {{ .Values.commonEnv.DB_HOST }} -p {{ .Values.commonEnv.DB_PORT }} -U {{ .Values.commonEnv.DB_USER }}; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: dbPassword
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: server
          {{- if .Values.global.securityContexts }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "zone-apps.image" (dict
            "repository" .Values.server.image.repository
            "tag"        .Values.server.image.tag
            "digest"     (.Values.server.image.digest | default "")
            "Values"     .Values
          ) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.targetPort }}
              protocol: TCP
          env:
            {{- include "zone-apps.commonEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.server.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: dbPassword
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: jwtSecret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: encryptionKey
            {{- if .Values.secrets.stripeSecretKey }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: stripeSecretKey
            {{- end }}
            {{- if .Values.secrets.smtpPassword }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: smtpPassword
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.affinity .Values.server.podAntiAffinity }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- end }}
        {{- if .Values.server.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml .Values.server.podAntiAffinity | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.server.topologySpreadConstraints | nindent 8 }}
      {{- end }}
{{- end }}
