{{- if .Values.server.enabled }}
{{- $agentStateClaim := include "zone-apps.server.agentStateClaim" . }}
{{- $sharedState := and $agentStateClaim (include "zone-apps.server.sharedState" .) }}
{{- $probes := .Values.server.probes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zone-apps.fullname" . }}-server
  labels:
    {{- include "zone-apps.server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  strategy:
    {{- if and $agentStateClaim (not $sharedState) }}
    type: Recreate
    {{- else if .Values.server.strategy }}
    {{- toYaml .Values.server.strategy | nindent 4 }}
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    {{- end }}
  selector:
    matchLabels:
      {{- include "zone-apps.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.service.port | quote }}
        prometheus.io/path: "/metrics"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "zone-apps.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zone-apps.serviceAccountName" . }}
      {{- if .Values.global.securityContexts }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if not .Values.global.externalDatabase }}
      initContainers:
        - name: wait-for-database
          image: {{ .Values.initContainers.postgres.image | default "postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b" }}
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h {{ .Values.commonEnv.DB_HOST }} -p {{ .Values.commonEnv.DB_PORT }} -U {{ .Values.commonEnv.DB_USER }}; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: {{ include "zone-apps.secretKey" (dict "root" . "name" "dbPassword" "default" "postgres-password") }}
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: server
          {{- if .Values.global.securityContexts }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "zone-apps.image" (dict
            "repository" .Values.server.image.repository
            "tag"        .Values.server.image.tag
            "digest"     (.Values.server.image.digest | default "")
            "Values"     .Values
          ) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.targetPort }}
              protocol: TCP
          env:
            {{- include "zone-apps.commonEnv" . | nindent 12 }}
            - name: HOME
              value: /home/zone
            - name: ZONE_AGENT_STATE_DIR
              value: /app/agent-state
            - name: ZONE_PROJECT_CLONE_DIR
              value: /app/clones
            - name: ZONE_CHAT_AGENT_CWD
              value: /app/workspace
            {{- if .Values.server.hostRoot }}
            - name: ZONE_HOST_ROOT
              value: {{ .Values.server.hostRoot | quote }}
            - name: ZONE_IN_CONTAINER
              value: "true"
            {{- end }}
            {{- with include "zone-apps.server.baseUrl" . }}
            - name: APP_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.server.env }}
            {{- if not (has $key (list "APP_BASE_URL" "REDIS_URL")) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: {{ include "zone-apps.secretKey" (dict "root" . "name" "databaseUrl" "default" "database-url") }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: {{ include "zone-apps.secretKey" (dict "root" . "name" "redisUrl" "default" "valkey-url") }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: {{ include "zone-apps.secretKey" (dict "root" . "name" "jwtSecret" "default" "jwt-secret") }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: {{ include "zone-apps.secretKey" (dict "root" . "name" "encryptionKey" "default" "encryption-key") }}
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: {{ include "zone-apps.secretKey" (dict "root" . "name" "litellmKey" "default" "litellm-master-key") }}
            {{- if .Values.secrets.stripeSecretKey }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: stripeSecretKey
            {{- end }}
            {{- if .Values.secrets.smtpPassword }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.secretsName" . }}
                  key: smtpPassword
            {{- end }}
          {{- if $probes.startup.enabled }}
          startupProbe:
            {{- include "zone-apps.probe" $probes.startup | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- include "zone-apps.probe" $probes.liveness | nindent 12 }}
          readinessProbe:
            {{- include "zone-apps.probe" $probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $sharedState }}
            - name: agent-state
              mountPath: /app/artifacts
              subPath: artifacts
            {{- else }}
            - name: artifacts
              mountPath: /app/artifacts
            {{- end }}
            - name: embed-cache
              mountPath: /app/embed-cache
            - name: home
              mountPath: /home/zone
            {{- if $sharedState }}
            - name: agent-state
              mountPath: /app/workspace
              subPath: workspace
            - name: agent-state
              mountPath: /app/agent-state
              subPath: agent-state
            {{- else }}
            - name: workspace
              mountPath: /app/workspace
            - name: agent-state
              mountPath: /app/agent-state
            {{- end }}
            - name: agent-state
              mountPath: /app/clones
              subPath: clones
            {{- if .Values.server.hostRoot }}
            - name: host
              mountPath: /host
            {{- end }}
      {{- if not (kindIs "invalid" .Values.server.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not $sharedState }}
        - name: artifacts
          emptyDir: {}
        {{- end }}
        - name: embed-cache
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- if not $sharedState }}
        - name: workspace
          emptyDir: {}
        {{- end }}
        - name: agent-state
          {{- if $agentStateClaim }}
          persistentVolumeClaim:
            claimName: {{ $agentStateClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.server.hostRoot }}
        - name: host
          hostPath:
            path: {{ .Values.server.hostRoot | quote }}
            type: Directory
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.affinity .Values.server.podAntiAffinity }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- end }}
        {{- if .Values.server.podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml .Values.server.podAntiAffinity | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.server.topologySpreadConstraints | nindent 8 }}
      {{- end }}
{{- end }}
