{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zone-apps.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Hook to run before main deployments
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "zone-apps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
      annotations:
        # Disable service mesh sidecar for migration job
        sidecar.istio.io/inject: "false"
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "zone-apps.serviceAccountName" . }}
      {{- if .Values.global.securityContexts }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if not .Values.global.externalDatabase }}
      initContainers:
        - name: wait-for-database
          image: {{ .Values.initContainers.postgres.image | default "postgres:15-alpine" }}
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h {{ .Values.commonEnv.DB_HOST }} -p {{ .Values.commonEnv.DB_PORT }} -U {{ .Values.commonEnv.DB_USER }}; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: dbPassword
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: migration
          {{- if .Values.global.securityContexts }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "zone-apps.image" (dict
            "repository" .Values.migration.image.repository
            "tag"        .Values.migration.image.tag
            "digest"     (.Values.migration.image.digest | default "")
            "Values"     .Values
          ) | quote }}
          imagePullPolicy: {{ .Values.migration.image.pullPolicy | default .Values.image.pullPolicy }}
          command: ["/app/zone_server"]
          args: ["migrate"]
          env:
            {{- include "zone-apps.commonEnv" . | nindent 12 }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zone-apps.fullname" . }}-secrets
                  key: dbPassword
            {{- range $key, $value := .Values.migration.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
