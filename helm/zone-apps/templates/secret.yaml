{{- if .Values.secrets.create }}
{{- if not .Values.secrets.dbPassword }}
{{- fail "secrets.dbPassword is required when secrets.create=true" }}
{{- end }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required when secrets.create=true" }}
{{- end }}
{{- if not .Values.secrets.encryptionKey }}
{{- fail "secrets.encryptionKey is required when secrets.create=true" }}
{{- end }}
{{- if lt (len .Values.secrets.jwtSecret) 32 }}
{{- fail "secrets.jwtSecret must be at least 32 characters" }}
{{- end }}
{{- if lt (len .Values.secrets.encryptionKey) 32 }}
{{- fail "secrets.encryptionKey must be at least 32 characters" }}
{{- end }}
{{- $dbUrl := printf "postgres://%s:%s@%s:%s/%s" .Values.commonEnv.DB_USER (.Values.secrets.dbPassword | urlquery) .Values.commonEnv.DB_HOST .Values.commonEnv.DB_PORT .Values.commonEnv.DB_NAME }}
{{- $redisUrl := .Values.commonEnv.REDIS_URL | default "" }}
{{- if not $redisUrl }}
{{- if .Values.secrets.redisPassword }}
{{- $redisUrl = printf "redis://:%s@%s:%s" (.Values.secrets.redisPassword | urlquery) .Values.commonEnv.VALKEY_HOST .Values.commonEnv.VALKEY_PORT }}
{{- else }}
{{- $redisUrl = printf "redis://%s:%s" .Values.commonEnv.VALKEY_HOST .Values.commonEnv.VALKEY_PORT }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zone-apps.secretsName" . }}
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.dbPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
  database-url: {{ $dbUrl | quote }}
  valkey-url: {{ $redisUrl | quote }}
  {{- if .Values.secrets.litellmMasterKey }}
  litellm-master-key: {{ .Values.secrets.litellmMasterKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeSecretKey }}
  stripeSecretKey: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  smtpPassword: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
{{- end }}
