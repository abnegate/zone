{{- if .Values.secrets.create }}
{{- if not .Values.secrets.dbPassword }}
{{- fail "secrets.dbPassword is required. Set via --set secrets.dbPassword=<secure-password>" }}
{{- end }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required. Set via --set secrets.jwtSecret=<secure-random-string>" }}
{{- end }}
{{- if not .Values.secrets.encryptionKey }}
{{- fail "secrets.encryptionKey is required. Set via --set secrets.encryptionKey=<secure-random-key>" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zone-apps.fullname" . }}-secrets
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
type: Opaque
data:
  # Database password (base64 encoded)
  dbPassword: {{ .Values.secrets.dbPassword | b64enc | quote }}

  # JWT secret for authentication (base64 encoded)
  jwtSecret: {{ .Values.secrets.jwtSecret | b64enc | quote }}

  # Encryption key for data at rest (base64 encoded)
  encryptionKey: {{ .Values.secrets.encryptionKey | b64enc | quote }}

  {{- if .Values.secrets.stripeSecretKey }}
  # Stripe secret key for payments (base64 encoded)
  stripeSecretKey: {{ .Values.secrets.stripeSecretKey | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.smtpPassword }}
  # SMTP password for email (base64 encoded)
  smtpPassword: {{ .Values.secrets.smtpPassword | b64enc | quote }}
  {{- end }}
{{- end }}
