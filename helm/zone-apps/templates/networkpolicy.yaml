{{- if .Values.networkPolicy.enabled }}
---
# Default deny all traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-apps.fullname" . }}-default-deny
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# Allow ingress to server from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-apps.fullname" . }}-server-ingress
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-apps.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.service.port }}
---
# Allow egress from server to database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-apps.fullname" . }}-server-egress
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-apps.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow database connections
    {{- if .Values.global.externalDatabase }}
    {{- $externalDatabaseCIDR := required "networkPolicy.externalDatabaseCIDR is required when networkPolicy.enabled=true and global.externalDatabase=true" .Values.networkPolicy.externalDatabaseCIDR }}
    - to:
        - ipBlock:
            cidr: {{ $externalDatabaseCIDR | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.commonEnv.DB_PORT | int }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: zone-postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    # Allow Valkey connections
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - protocol: TCP
          port: 6379
    # Allow LiteLLM connections
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
---
# Allow ingress to manager from ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-apps.fullname" . }}-manager-ingress
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-apps.manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.manager.service.port }}
---
# Allow egress from manager (for external resources like CDNs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zone-apps.fullname" . }}-manager-egress
  labels:
    {{- include "zone-apps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zone-apps.manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow HTTPS for external resources (CDNs, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
