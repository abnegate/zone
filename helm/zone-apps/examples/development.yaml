# Development deployment example for Zone
environment: development

global:
  externalDatabase: false
  securityContexts: false

commonEnv:
  DB_HOST: "zone-postgres-rw"
  DB_PORT: "5432"
  DB_NAME: "manager"
  DB_USER: "zone"
  RUST_LOG: "debug"
  LITELLM_HOST: "http://litellm:4000"
  OLLAMA_HOST: "http://ollama:11434"

secrets:
  create: false
  existingSecret: zone-secrets

server:
  enabled: true
  replicaCount: 1
  image:
    repository: zone/server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

manager:
  enabled: true
  replicaCount: 1
  image:
    repository: zone/manager
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

ingress:
  enabled: true
  className: haproxy
  hosts:
    - host: zone.localhost
      paths:
        - path: /api
          pathType: Prefix
          service: server
        - path: /ws
          pathType: Prefix
          service: server
        - path: /
          pathType: Prefix
          service: manager

migration:
  enabled: false
