# Minimal deployment example for Zone
environment: development

global:
  externalDatabase: true
  securityContexts: true

secrets:
  create: true
  existingSecret: ""
  dbPassword: "testpassword"
  jwtSecret: "test-jwt-secret-at-least-32-characters"
  encryptionKey: "test-encryption-key-32-characters"
  litellmMasterKey: "test-litellm-master-key"

server:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

manager:
  enabled: true
  replicaCount: 1
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

ingress:
  enabled: false

migration:
  enabled: false
