# Kind cluster configuration for Zone development.
# scripts/kind-create.sh substitutes KIND_HTTP_PORT / KIND_HTTPS_PORT / KIND_STATS_PORT
# when host ports 80/443 are already bound (for example by docker compose).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zone-dev

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: ${KIND_HTTP_PORT}
        protocol: TCP
      - containerPort: 443
        hostPort: ${KIND_HTTPS_PORT}
        protocol: TCP
      - containerPort: 31024
        hostPort: ${KIND_STATS_PORT}
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
