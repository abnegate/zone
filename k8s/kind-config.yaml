# Kind cluster configuration for Zone development
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zone-dev

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP for Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS for Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # HAProxy stats
      - containerPort: 31024
        hostPort: 31024
        protocol: TCP
      # NodePort range for direct service access
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
    extraMounts:
      # Mount local storage for persistent volumes
      # Note: This path uses shell expansion and must be processed by the script that creates the cluster
      # The actual path will be: $HOME/.zone/data
      - hostPath: ~/.zone/data
        containerPath: /zone-data

# Networking configuration
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
