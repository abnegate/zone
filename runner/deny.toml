# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Keep reporting all unmaintained advisories; CI preserves warning severity.
unmaintained = "all"
yanked = "warn"
# Match the existing cargo-audit exception. Server JWTs use HMAC secrets only;
# octocrab is not called by zone_context. See docs/DEPENDENCIES.md.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Existing audit exception: no RSA private-key operations; server JWT uses HMAC, and octocrab is unused by zone_context." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8
# Reviewed versions already present in Cargo.lock; future versions need review.
# License provenance and dependency paths are recorded in docs/DEPENDENCIES.md.
exceptions = [
    { crate = "cssparser@0.36.0", allow = ["MPL-2.0"] },
    { crate = "cssparser@0.37.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.6.1", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.7.0", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "libfuzzer-sys@0.4.13", allow = ["MIT", "Apache-2.0", "NCSA"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "quoted_printable@0.5.2", allow = ["0BSD"] },
    { crate = "selectors@0.36.1", allow = ["MPL-2.0"] },
    { crate = "selectors@0.38.0", allow = ["MPL-2.0"] },
    { crate = "webpki-root-certs@1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { crate = "xxhash-rust@0.8.18", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
