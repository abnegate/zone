[package]
name = "zone_enterprise"
description = "Zone Enterprise license verification"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Zone-Enterprise"
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
audit = ["dep:hex", "dep:hmac", "dep:md-5", "dep:sha2", "dep:url"]
signing = []
sso = [
    "dep:aws-lc-rs",
    "dep:dashmap",
    "dep:flate2",
    "dep:jsonwebtoken",
    "dep:quick-xml",
    "dep:rand",
    "dep:reqwest",
    "dep:rustls-pki-types",
    "dep:rustls-webpki",
    "dep:sha2",
    "dep:url",
]

[dependencies]
aws-lc-rs = { version = "=1.18.1", optional = true }
base64 = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
flate2 = { version = "=1.1.10", optional = true }
hex = { version = "=0.4.3", optional = true }
hmac = { version = "=0.13.0", optional = true }
jsonwebtoken = { workspace = true, optional = true }
md-5 = { version = "=0.11.0", optional = true }
quick-xml = { version = "=0.41.0", optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["form"] }
rustls-pki-types = { version = "=1.15.1", optional = true }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "=0.11.0", optional = true }
thiserror = { workspace = true }
url = { version = "=2.5.8", optional = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
toml = { workspace = true }
wiremock = "=0.6.5"
