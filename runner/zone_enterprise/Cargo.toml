[package]
name = "zone_enterprise"
description = "Zone Enterprise license verification"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Zone-Enterprise"
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
audit = ["dep:hex", "dep:hmac", "dep:sha2", "dep:url"]
signing = []
sso = ["dep:dashmap", "dep:jsonwebtoken", "dep:rand", "dep:reqwest", "dep:sha2", "dep:url"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
hex = { version = "=0.4.3", optional = true }
hmac = { version = "=0.13.0", optional = true }
jsonwebtoken = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "=0.11.0", optional = true }
thiserror = { workspace = true }
url = { version = "=2.5.8", optional = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
toml = { workspace = true }
wiremock = "=0.6.5"
