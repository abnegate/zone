[package]
name = "zone_cli"
description = "Zone CLI - AI coding agent for your terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "zone"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
anyhow = "=1.0.104"

# CLI
clap = { workspace = true }
dialoguer = { workspace = true }
indicatif = { workspace = true }
console = "=0.16.4"
rand = { workspace = true }

# Config & storage
abnegate-config = { workspace = true, features = ["keyring"] }
abnegate-secret = { workspace = true }
base64 = { workspace = true }

# Internal
zone_core = { path = "../zone_core" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "=3.27.0"
toml = { workspace = true }

# The platform keychain initialises without a Secret Service only on macOS,
# so the test that reads an earlier CLI's entries runs there.
[target.'cfg(target_os = "macos")'.dev-dependencies]
keyring = "=4.2.0"
keyring-core = "=1.0.0"
