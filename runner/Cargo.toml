[workspace]
resolver = "2"
members = ["tool_runner", "zone_runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zone-dev/zone"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.48", features = ["full", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
bytes = "1.11"
base64 = "0.22"
dashmap = "6.1"
tokio-stream = "0.1"

[workspace.dependencies.nix]
version = "0.30"
features = ["signal", "process"]

[profile.release]
lto = true
codegen-units = 1
strip = true
