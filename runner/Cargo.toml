[workspace]
resolver = "2"
members = ["tool_runner", "zone_runner", "zone_core", "zone_server", "zone_cli", "zone_installer", "zone_context"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zone-dev/zone"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.48", features = ["full", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
bytes = "1.11"
base64 = "0.22"
dashmap = "6.1"
once_cell = "1.20"
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"

# Server dependencies
axum = { version = "0.8", features = ["ws", "macros"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "ipnetwork", "bigdecimal", "macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rand = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# CLI dependencies
keyring = "3"
dirs = "5"
toml = "0.8"
dialoguer = "0.11"
indicatif = "0.17"

[workspace.dependencies.nix]
version = "0.30"
features = ["signal", "process"]

[profile.release]
lto = true
codegen-units = 1
strip = true
