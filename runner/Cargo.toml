[workspace]
resolver = "2"
members = ["tool_runner", "zone_runner", "zone_core", "zone_server", "zone_cli", "zone_installer", "zone_context"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zone-dev/zone"
rust-version = "1.97.1"

[workspace.dependencies]
tokio = { version = "=1.53.1", features = ["full", "process", "signal"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
clap = { version = "=4.6.6", features = ["derive"] }
futures = "=0.3.34"
bytes = "=1.12.1"
base64 = "=0.23.1"
dashmap = "=6.2.1"
once_cell = "=1.21.4"
tokio-stream = "=0.1.19"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
reqwest = { version = "=0.13.4", features = ["json", "stream"] }
async-trait = "=0.1.92"

# Server dependencies
axum = { version = "=0.8.9", features = ["ws", "macros"] }
sqlx = { version = "=0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "ipnetwork", "bigdecimal", "macros"] }
redis = { version = "=1.6.0", features = ["tokio-comp"] }
jsonwebtoken = { version = "=11.0.0", features = ["rust_crypto"] }
argon2 = "=0.6.0"
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["cors", "trace", "fs"] }
rand = "=0.10.2"
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"

# CLI dependencies
keyring = "=4.2.0"
dirs = "=6.0.0"
toml = "=1.1.5"
dialoguer = "=0.12.0"
indicatif = "=0.18.6"

[workspace.dependencies.nix]
version = "=0.31.3"
features = ["signal", "process"]

[profile.release]
lto = true
codegen-units = 1
strip = true
