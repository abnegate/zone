<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zone</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f0e8; --ink: #1a1612; --muted: #534b42; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0e0c0a; --ink: #f3eee6; --muted: #c4b8a8; }
      }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; }
      h1 { font-size: 42px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Zone</h1>
      <p>Starting…</p>
    </main>
  </body>
</html>
