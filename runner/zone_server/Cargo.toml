[package]
name = "zone_server"
description = "Zone API server - HTTP, WebSocket, and database layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["local-embeddings"]
# In-process embeddings (EMBEDDING_ENGINE=local). Links ONNX Runtime, which
# publishes no musl prebuilts, so any image building this must be glibc-based.
local-embeddings = ["zone_context/local-embeddings"]

[lib]
name = "zone_server"
path = "src/lib.rs"

[[bin]]
name = "zone-server"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
# Stream adapters (LLM chunks -> AgentEvent)
async-stream = "0.3"

# HTTP framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { workspace = true }

# Cache
redis = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
sha2 = "=0.11.0"
hex = "=0.4.3"
rand = "=0.10.2"
hmac = "=0.13.0"
subtle = "=2.6.1"
regex = "=1.13.1"

# Encryption
aes-gcm = "=0.11.1"
base64 = "=0.23.1"

# Email
lettre = { version = "=0.11.23", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

# WebSocket
dashmap = { workspace = true }
once_cell = { workspace = true }

# HTTP client (for proxying to Ollama)
reqwest = { workspace = true, features = ["multipart"] }
urlencoding = "=2.1.3"

# HTML parsing for web content extraction
scraper = "=0.27.0"

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Internal
zone_core = { path = "../zone_core" }
zone_context = { path = "../zone_context" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
http-body-util = "=0.1.5"
tower = { workspace = true, features = ["util"] }
bytes = { workspace = true }
tokio-tungstenite = "=0.30.0"
futures-util = "=0.3.34"
zone_context = { path = "../zone_context", features = ["test-utils"] }
wiremock = "=0.6.5"
