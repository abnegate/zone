<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zone</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f0e8;
        --ink: #1a1612;
        --muted: #534b42;
        --line: #d9d0c4;
        --card: #fffdf8;
        --accent: #1a1612;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }
      form {
        width: min(440px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 36px 32px 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p { margin: 0; color: var(--muted); line-height: 1.45; }
      label { font-size: 13px; font-weight: 600; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        background: #fff;
      }
      input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
      button {
        margin-top: 6px;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .error { color: #9b2c2c; min-height: 1.2em; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <form id="setup" autocomplete="off">
        <h1>Zone</h1>
        <p>Connect this app to your Zone server. You can change this later from the Zone menu.</p>
        <label for="host">Server URL</label>
        <input
          id="host"
          name="host"
          type="url"
          required
          spellcheck="false"
          placeholder="https://manager.localhost"
          value="https://manager.localhost"
        />
        <p class="error" id="error"></p>
        <button type="submit">Continue</button>
      </form>
    </main>
    <script>
      const form = document.getElementById("setup");
      const host = document.getElementById("host");
      const error = document.getElementById("error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        form.querySelector("button").disabled = true;
        try {
          const response = await fetch("/api/setup", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ host: host.value.trim() }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "Could not save server URL");
          }
          window.location.replace("/");
        } catch (err) {
          error.textContent = err.message || "Could not save server URL";
          form.querySelector("button").disabled = false;
        }
      });
    </script>
  </body>
</html>
