[package]
name = "zone_comfy"
description = "ComfyUI image, video, and audio generation, model inventory, and LoRA training"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Subject detection for training crops. Pulls in the ONNX Runtime native
# library, so it is opt-in for the same reason zone_context's local-embeddings
# is. Without it a photo is cropped on its centre and a video frame on whatever
# moved.
saliency = ["zone_vision/saliency"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
urlencoding = "=2.1.3"

# Vision captioning talks to an OpenAI-compatible endpoint
zone_core = { path = "../zone_core" }

# Subject-aware cropping for video frames and for orienting uploaded photos
zone_vision = { path = "../zone_vision" }

# Encodes the cropped training frames. Decoding is zone_vision's job, so only
# the PNG writer is needed here.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tempfile = "=3.27.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = "=0.6.5"
