[package]
name = "zone_license"
description = "Zone license signer and Polar webhook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zone-license"
path = "src/main.rs"

[dependencies]
abnegate-http = { workspace = true }
abnegate-notify = { workspace = true, features = ["smtp"] }
abnegate-secret = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
ipnet = "=2.12.1"
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-native-tls"] }
reqwest = { workspace = true }
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.11.0"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
zeroize = "=1.9.0"
zone_enterprise = { path = "../zone_enterprise", features = ["signing"] }

[dev-dependencies]
http-body-util = "=0.1.5"
jsonwebtoken = { workspace = true }
tempfile = "=3.27.0"
tower = { workspace = true, features = ["util"] }
wiremock = "=0.6.5"
