version: 0.1
log:
  level: info
  formatter: json
  fields:
    service: zone-registry
  accesslog:
    disabled: true
storage:
  s3:
    rootdirectory: /registry
    encrypt: true
    secure: true
    v4auth: true
    objectacl: bucket-owner-full-control
  delete:
    enabled: false
  redirect:
    disable: false
  cache:
    blobdescriptor: inmemory
  maintenance:
    uploadpurging:
      enabled: false
    readonly:
      enabled: true
auth:
  token:
    realm: https://licenses.bitecode.ltd/token
    service: registry.bitecode.ltd
    issuer: zone-license
    jwks: /etc/zone-registry/jwks.json
    signingalgorithms:
      - EdDSA
http:
  addr: :5000
  host: https://registry.bitecode.ltd
  headers:
    X-Content-Type-Options: [nosniff]
