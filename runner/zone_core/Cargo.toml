[package]
name = "zone_core"
description = "Core agent logic for Zone - shared between server and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
sqlx = ["abnegate-secret/sqlx"]
# Test-only helpers for other crates' tests: the environment guards
# (`variables`, `vpn::Hold`) and `llm::cli::prompt`.
test-support = []

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

abnegate-agent = { workspace = true, features = ["mcp"] }
abnegate-agent-cli = { workspace = true }
abnegate-exec = { workspace = true }
abnegate-llm = { workspace = true }
abnegate-secret = { workspace = true }
zone_routing = { path = "../zone_routing" }

# Streaming
async-stream = "=0.3.6"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util", "macros"] }
tracing-subscriber = { workspace = true }
wiremock = "=0.6.5"
