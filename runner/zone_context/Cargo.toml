[package]
name = "zone_context"
description = "Context gathering and heuristic analysis for Zone AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-utils = []
# In-process embedding inference (ONNX Runtime via fastembed). Pulls in the
# onnxruntime native library, so it is opt-in; zone_server enables it.
local-embeddings = ["dep:fastembed", "dep:dirs"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }

# Database
sqlx = { workspace = true }

# Token counting
tiktoken-rs = "=0.12.0"

# Streaming
async-stream = "=0.3.6"

# HTTP clients for adapters
octocrab = "=0.54.1"

# Content parsing
scraper = "=0.27.0"

# Text processing
regex = "=1.13.1"
sha2 = "=0.11.0"

# Code parsing
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-swift = "=0.7.3"
tree-sitter-sequel = "=0.3.11"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"

# Filesystem traversal
walkdir = "=2.5.0"
glob = "=0.3.4"

# Base64 encoding/decoding
base64 = "=0.23.1"

# URL encoding
percent-encoding = "=2.3.2"
url = "=2.5.8"

# In-process embeddings (feature: local-embeddings)
fastembed = { version = "=6.0.2", optional = true }
dirs = { workspace = true, optional = true }

# Internal
zone_core = { path = "../zone_core" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "=3.27.0"
wiremock = "=0.6.5"
