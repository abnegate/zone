# Full-tunnel overlay selected by the `vpn` profile (`make up-vpn`,
# `make up PROFILES=vpn`, ZONE_VPN=1). Internet-facing app containers share
# Gluetun's network namespace so every packet uses the tunnel and Gluetun's
# kill switch. Traefik, Postgres, Valkey, Prometheus, and the console stay on
# Docker networks for inbound UI and local service discovery. Gluetun DNS is
# DoT-only, and Docker forbids extra_hosts on network_mode=service, so
# VPN-attached apps use the pinned internal addresses. Requires Compose v2.24+
# (`!reset` / `!override`). Combinable with `dev` and `monitoring`.
#
# Usage:
#   make up PROFILES=dev,vpn,monitoring
#   ./scripts/compose.sh --profile vpn up -d

services:
  gluetun:
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gluetun:127.0.0.1"
      - "postgres:172.30.0.20"
      - "valkey:172.30.0.21"
      - "prometheus:172.30.0.22"
    environment:
      FIREWALL_INPUT_PORTS: 8080,8001,8000,4000,3000,8188,11434,8888
      # Default control API is :8000, which collides with manager in this namespace.
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8007
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      internal:
        aliases:
          - manager
          - litellm
          - grafana
          - ollama
          - comfyui
          - searxng
      edge:
        aliases:
          - manager
          - litellm
          - grafana
          - ollama
          - comfyui
          - searxng
    labels:
      - traefik.enable=true
      - traefik.docker.network=zone_edge
      - traefik.http.services.manager.loadbalancer.server.port=8000
      - traefik.http.routers.manager.rule=(Host(`manager.localhost`) || Host(`manager.${DOMAIN_HOST_WEBUI}`)) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
      - traefik.http.routers.manager.entrypoints=web
      - traefik.http.routers.manager.service=manager
      - traefik.http.routers.manager.middlewares=security-headers
      - traefik.http.routers.manager-secure.rule=(Host(`manager.localhost`) || Host(`manager.${DOMAIN_HOST_WEBUI}`)) && (PathPrefix(`/api`) || PathPrefix(`/ws`))
      - traefik.http.routers.manager-secure.entrypoints=websecure
      - traefik.http.routers.manager-secure.service=manager
      - traefik.http.routers.manager-secure.middlewares=security-headers
      - traefik.http.routers.manager-secure.tls=true
      - traefik.http.routers.manager-secure.tls.certresolver=letsencrypt
      - traefik.http.services.litellm.loadbalancer.server.port=4000
      - traefik.http.routers.litellm.rule=Host(`litellm.${DOMAIN_HOST_WEBUI}`)
      - traefik.http.routers.litellm.entrypoints=web
      - traefik.http.routers.litellm.service=litellm
      - traefik.http.routers.litellm.middlewares=auth,security-headers
      - traefik.http.routers.litellm-secure.rule=Host(`litellm.${DOMAIN_HOST_WEBUI}`)
      - traefik.http.routers.litellm-secure.entrypoints=websecure
      - traefik.http.routers.litellm-secure.service=litellm
      - traefik.http.routers.litellm-secure.middlewares=auth,security-headers
      - traefik.http.routers.litellm-secure.tls=true
      - traefik.http.routers.litellm-secure.tls.certresolver=letsencrypt
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_HOST_WEBUI}`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.routers.grafana.service=grafana
      - traefik.http.routers.grafana.middlewares=security-headers
      - traefik.http.routers.grafana-secure.rule=Host(`grafana.${DOMAIN_HOST_WEBUI}`)
      - traefik.http.routers.grafana-secure.entrypoints=websecure
      - traefik.http.routers.grafana-secure.service=grafana
      - traefik.http.routers.grafana-secure.middlewares=security-headers
      - traefik.http.routers.grafana-secure.tls=true
      - traefik.http.routers.grafana-secure.tls.certresolver=letsencrypt

  traefik:
    environment:
      HTTP_PROXY: http://gluetun:8888
      HTTPS_PROXY: http://gluetun:8888
      NO_PROXY: localhost,127.0.0.1,traefik,console,gluetun,prometheus,grafana,manager,litellm,postgres,valkey,blackbox,cadvisor,ollama,comfyui,searxng,ollama-metrics,postgres-exporter,valkey-exporter,172.16.0.0/12,172.30.0.0/24,172.31.0.0/24
    depends_on:
      gluetun:
        condition: service_healthy

  manager:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    labels: !override
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      LITELLM_HOST: http://127.0.0.1:4000
      SEARCH_SEARXNG_QUERY_URL: http://127.0.0.1:8080/search?q=<query>&format=json
      MONITORING_GRAFANA_URL: http://127.0.0.1:3000
      MODEL_SEARCH_PROXY_URL: http://127.0.0.1:8888
      TOOL_RUNNER_PROXY_URL: http://127.0.0.1:8888
      # Docker forbids extra_hosts with network_mode=service. Gluetun DoT also
      # cannot resolve Docker names, so use the pinned internal addresses.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@172.30.0.20:5432/${MANAGER_POSTGRES_DB:-manager}
      REDIS_URL: redis://172.30.0.21:6379
      POSTGRES_HOST: "172.30.0.20"
      VALKEY_HOST: "172.30.0.21"
      MONITORING_PROMETHEUS_URL: http://172.30.0.22:9090

  litellm:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    labels: !override
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "172.30.0.20"

  grafana:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    environment:
      PROMETHEUS_URL: http://172.30.0.22:9090
    labels: !override
      - traefik.enable=false
    depends_on:
      gluetun:
        condition: service_healthy

  ollama:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    depends_on:
      gluetun:
        condition: service_healthy

  ollama-init:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    depends_on:
      gluetun:
        condition: service_healthy

  comfyui:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    depends_on:
      gluetun:
        condition: service_healthy

  comfyui-model-setup:
    network_mode: "service:gluetun"
    networks: !reset
    extra_hosts: !reset
    ports: !reset
    depends_on:
      gluetun:
        condition: service_healthy

  console:
    environment:
      VITE_PROXY_TARGET: http://gluetun:8000
