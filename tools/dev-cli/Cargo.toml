[package]
name = "zone-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Development CLI tool for Zone - runs format/lint/test/coverage across all projects"

[[bin]]
name = "zone-dev"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.48", features = ["full"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Colors and styling
owo-colors = "4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time
chrono = "0.4"

# Process management
which = "7"

[profile.release]
lto = true
codegen-units = 1
strip = true
