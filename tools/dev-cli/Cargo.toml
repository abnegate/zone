[package]
name = "zone-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Development CLI tool for Zone - runs format/lint/test/coverage across all projects"

[[bin]]
name = "zone-dev"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "=4.6.6", features = ["derive"] }

# Async runtime
tokio = { version = "=1.53.1", features = ["full"] }

# TUI
ratatui = "=0.30.2"
crossterm = "=0.29.0"

# Colors and styling
owo-colors = "=4.4.0"

# Error handling
anyhow = "=1.0.104"
thiserror = "=2.0.20"

# Time
chrono = "=0.4.45"

# Process management
which = "=8.0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
