# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/getting-started/yaml-configuration

language: en-US
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  abort_on_close: true
  path_filters:
    - "!**/bun.lock"
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Focus on correctness, security, and API contract changes.
        Flag unwrap()/expect() on production request paths, unparameterized SQL,
        leaked secrets or tokens in logs, missing error context, and breaking
        changes to proto or HTTP APIs. Prefer existing crate and module patterns.
    - path: "**/*.{ts,tsx}"
      instructions: |
        Review React/TypeScript for accessibility, error handling, and state
        consistency across routes. Prefer existing @zone/ui components. Flag
        secrets in client code, untyped API responses, and missing loading or
        empty states. Do not nitpick formatting already covered by Biome.
    - path: "helm/**/*.{yaml,yml}"
      instructions: |
        Flag unpinned images, missing resource limits, hardcoded secrets, overly
        permissive RBAC or NetworkPolicy, and values that would break existing
        deployments. Prefer chart patterns already used in this repository.
    - path: "{docker-compose*.yml,**/Dockerfile*}"
      instructions: |
        Flag unpinned images, missing health checks, secrets written into
        compose or image layers, and privileged or host-network settings that
        are not already documented. Match existing service grouping and comments.
    - path: "**/*.{sh,bash}"
      instructions: |
        Require `set -euo pipefail` for bash, quoted variables, and explicit
        error handling. Flag secrets printed or committed, and missing usage
        comments on entrypoint scripts.
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_usernames:
      - dependabot[bot]
      - github-actions[bot]
  tools:
    biome:
      enabled: true
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    checkov:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
      - SECURITY.md
