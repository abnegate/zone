global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # PostgreSQL metrics via postgres_exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Valkey metrics via redis_exporter
  - job_name: 'valkey'
    static_configs:
      - targets: ['valkey-exporter:9121']

  # Ollama metrics via ollama-metrics exporter
  - job_name: 'ollama'
    metrics_path: /metrics
    static_configs:
      - targets: ['ollama-metrics:8080']

  # LiteLLM metrics (endpoint requires Authorization: Bearer $LITELLM_MASTER_KEY)
  - job_name: 'litellm'
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/litellm_bearer_token
    static_configs:
      - targets: ['litellm:4000']

  # Manager metrics (if available)
  - job_name: 'manager'
    metrics_path: /metrics
    static_configs:
      - targets: ['manager:8000']

  # Gluetun metrics via bundled exporter (vpn profile only)
  # Bundled mode provides VPN status + traffic metrics via netlink
  - job_name: 'gluetun'
    static_configs:
      - targets: ['gluetun:8001']

  # Container RSS/CPU (manager embeddings are the memory hog)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(memory_working_set_bytes|cpu_usage_seconds_total|fs_usage_bytes|network_receive_bytes_total|network_transmit_bytes_total|spec_memory_limit_bytes)|machine_memory_bytes'
        action: keep
      - source_labels: [id]
        regex: '^/$'
        action: drop

  # Host Ollama, host ComfyUI, and SearXNG-through-Gluetun
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:11434/api/tags
        labels:
          probe: ollama
      - targets:
          - http://host.docker.internal:8188/system_stats
        labels:
          probe: comfyui
      - targets:
          - http://gluetun:8080/
        labels:
          probe: searxng
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
